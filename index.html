<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCF8F3">
<title>校园π · 校园墙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#FBF7F3;
  --ink:#211E1B;
  --sub:#8B827A;
  --faint:#BCB3A9;
  --line:rgba(33,30,27,.085);
  --rose:#C9516F;
  --rose-soft:rgba(201,81,111,.09);
  --warm:#EFE4DB;
  --warm-deep:#E4D5C9;
  --glass:linear-gradient(152deg,rgba(255,255,255,.74),rgba(255,255,255,.44));
  --stroke:rgba(255,255,255,.82);
  --blur:blur(24px) saturate(160%);
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,"Times New Roman",serif;
  --r:22px;
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:-12%;z-index:0;pointer-events:none;
  background:
    radial-gradient(680px 520px at 6% -12%, #F6E4DA 0%, rgba(246,228,218,0) 64%),
    radial-gradient(600px 480px at 94% 0%, #F3E7DE 0%, rgba(243,231,222,0) 62%),
    var(--cream);
  filter:saturate(108%);
}
#app{position:relative;z-index:1;width:100%;max-width:1120px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;padding-bottom:92px}
.ico{width:18px;height:18px;flex:0 0 auto;display:block;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:22px 24px 14px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.2px}
.brand i{font-style:normal;font-size:9px;letter-spacing:.3em;color:var(--faint)}
.brand .dot{width:5px;height:5px;border-radius:50%;background:var(--rose);margin-left:2px;
  animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.h-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{height:36px;padding:0 13px;display:inline-flex;align-items:center;gap:7px;border-radius:12px;
  font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;background:var(--glass);
  border:1px solid var(--stroke);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  transition:transform .2s,background .2s}
.pill:hover{transform:translateY(-1px)}
.pill .ico{width:15px;height:15px;color:var(--sub)}
.pill.ok{color:#A8465F}
.pill.ok .ico{color:#A8465F}
.searchbar{padding:0 24px 12px}
.searchbar input{width:100%;height:44px;padding:0 16px 0 42px;font-size:13px;border-radius:14px;outline:none;
  background:var(--glass);border:1px solid var(--stroke);color:var(--ink);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.searchbar{position:relative}
.searchbar .ico{position:absolute;left:38px;top:13px;color:var(--faint);width:15px;height:15px}
.searchbar input::placeholder{color:var(--faint)}

/* ---------- swipe strip ---------- */
.strip-wrap{position:relative}
.strip{display:flex;gap:8px;padding:2px 24px 14px;overflow-x:auto;scrollbar-width:none;
  cursor:grab;scroll-behavior:auto;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 26px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 26px),transparent 100%)}
.strip::-webkit-scrollbar{display:none}
.strip.dragging{cursor:grabbing;scroll-behavior:auto}
.chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;font-size:12.5px;letter-spacing:.01em;
  display:inline-flex;align-items:center;gap:6px;color:#57504A;cursor:pointer;user-select:none;
  background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.8);transition:.22s;white-space:nowrap}
.chip .ico{width:14px;height:14px;opacity:.6}
.chip:hover{background:#fff}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .ico{opacity:.95}
.hint-swipe{padding:0 24px 8px;font-size:10px;letter-spacing:.16em;color:var(--faint);display:flex;gap:6px;
  align-items:center}
.hint-swipe .ico{width:12px;height:12px}

/* ---------- carousel ---------- */
.car{position:relative;margin:6px 24px 18px;border-radius:26px;overflow:hidden;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--stroke);box-shadow:0 26px 60px -40px rgba(60,30,20,.5);touch-action:pan-y}
.car-track{display:flex;transition:transform .52s cubic-bezier(.22,1,.36,1);will-change:transform}
.slide{flex:0 0 100%;padding:26px 26px 22px;min-height:186px;display:flex;flex-direction:column;
  justify-content:space-between;position:relative;overflow:hidden}
.slide.s1,.slide.s2,.slide.s3{background:linear-gradient(142deg,rgba(255,255,255,.86),rgba(244,233,225,.62))}
.slide .eyebrow{font-size:9.5px;letter-spacing:.26em;color:var(--sub);font-weight:600}
.slide h2{font-family:var(--serif);font-size:clamp(19px,2.1vw,25px);font-weight:600;letter-spacing:-.3px;
  line-height:1.42;margin:10px 0 0;max-width:20em}
.slide .rowline{display:flex;align-items:flex-end;gap:20px;margin-top:18px;flex-wrap:wrap}
.slide .num{display:flex;flex-direction:column;gap:2px}
.slide .num b{font-size:30px;font-weight:200;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;line-height:1;
  white-space:nowrap}
.slide .num span{font-size:10px;color:var(--sub);letter-spacing:.04em;white-space:nowrap}
.slide .cta{margin-left:auto;height:34px;padding:0 14px;border-radius:11px;border:0;background:var(--ink);color:#fff;
  font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  white-space:nowrap;flex:0 0 auto}
.slide .cta .ico{width:13px;height:13px}
.slide::after{content:"";position:absolute;width:240px;height:240px;right:-70px;bottom:-120px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,rgba(201,81,111,.13),rgba(201,81,111,0) 70%)}
.dots{position:absolute;left:26px;bottom:16px;display:flex;gap:5px;z-index:2}
.dots i{width:5px;height:5px;border-radius:50%;background:rgba(33,30,27,.18);transition:.3s;cursor:pointer}
.dots i.on{width:16px;border-radius:3px;background:var(--rose)}

/* ---------- feed ---------- */
main{flex:1;padding:0 24px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 12px}
.sec h3{font-size:11px;letter-spacing:.22em;font-weight:600}
.sec .count{font-size:11px;color:var(--sub)}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:14px;align-items:start}
.post{position:relative;display:flex;flex-direction:column;padding:16px 16px 12px;border-radius:20px;cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:0 16px 40px -32px rgba(70,40,25,.55);
  transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s,border-color .3s;
  animation:rise .5s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.post:hover{transform:translateY(-4px);border-color:#fff;box-shadow:0 24px 50px -30px rgba(70,40,25,.5)}
.post.flash{animation:flash 1.6s ease}
@keyframes flash{0%,100%{box-shadow:0 16px 40px -32px rgba(70,40,25,.55)}
  30%{box-shadow:0 0 0 2px rgba(201,81,111,.45),0 24px 50px -30px rgba(70,40,25,.5)}}
.who{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;
  color:#6E5A50;letter-spacing:0}
.who .nm{display:flex;flex-direction:column;gap:1px;min-width:0}
.who .nm b{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
.who .nm b .ico{width:12px;height:12px;color:var(--rose)}
.who .nm span{font-size:10px;color:var(--faint)}
.who .tag{margin-left:auto;font-size:9.5px;letter-spacing:.1em;color:var(--sub);
  padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8)}
.post h4{font-family:var(--serif);font-size:15.5px;font-weight:600;line-height:1.45;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .txt{font-size:12.5px;line-height:1.75;color:#5C554F;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb{margin-top:11px;height:112px;border-radius:14px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.7)}
.thumb::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.6),transparent 55%)}
.thumb .tmark{position:absolute;right:14px;bottom:10px;color:rgba(255,255,255,.9);opacity:.85}
.thumb .tmark .ico{width:26px;height:26px;stroke-width:1.3}
.thumb .tlabel{position:absolute;left:14px;top:12px;font-size:9px;letter-spacing:.24em;color:rgba(60,40,35,.5)}
.post .foot{display:flex;align-items:center;gap:14px;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line);margin-top:auto}
.act{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--sub);cursor:pointer;
  background:none;border:0;padding:0;transition:color .18s}
.act .ico{width:15px;height:15px}
.act:hover{color:var(--ink)}
.act.on{color:var(--rose)}
.act.on .ico{fill:rgba(201,81,111,.14)}
.act.pop .ico{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.price{margin-left:auto;font-size:15px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.price.free{font-size:11px;letter-spacing:.06em;color:var(--sub);font-weight:500}
.take{height:30px;padding:0 12px;border-radius:9px;border:1px solid rgba(201,81,111,.3);background:var(--rose-soft);
  color:#A8465F;font-size:11.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  transition:.18s}
.take:hover{background:rgba(201,81,111,.16)}
.take .ico{width:13px;height:13px}
.badexp{position:absolute;top:14px;right:14px;display:none}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:30;
  width:min(430px,calc(100% - 32px));height:62px;border-radius:20px;display:flex;align-items:center;
  justify-content:space-around;padding:0 6px;background:rgba(255,255,255,.72);border:1px solid var(--stroke);
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:0 20px 44px -26px rgba(70,40,25,.55)}
.bnav button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9.5px;letter-spacing:.06em;color:var(--sub);padding:8px 12px;border-radius:12px;transition:.2s}
.bnav button .ico{width:19px;height:19px}
.bnav button.on{color:var(--ink)}
.bnav button.on .ico{stroke-width:1.9}
.bnav .fab{width:48px;height:48px;border-radius:16px;background:var(--rose);
  color:#fff;display:grid;place-items:center;box-shadow:0 12px 24px -14px rgba(201,81,111,.9);transition:.22s}
.bnav .fab:hover{transform:translateY(-2px)}
.bnav .fab .ico{width:21px;height:21px;stroke-width:2}

/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;z-index:40;background:rgba(33,30,27,.3);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .3s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;width:min(600px,100%);margin:0 auto;
  max-height:90dvh;overflow-y:auto;padding:14px 22px 26px;border-radius:28px 28px 0 0;
  background:rgba(255,253,251,.9);border:1px solid #fff;border-bottom:0;
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 -26px 60px -34px rgba(60,30,20,.5);
  transform:translateY(105%);transition:transform .44s cubic-bezier(.16,1,.3,1)}
.sheet.on{transform:none}
.sheet::-webkit-scrollbar{width:0}
.grab{width:38px;height:3px;border-radius:3px;background:rgba(33,30,27,.14);margin:0 auto 16px}
.sheet h3{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.2px;line-height:1.45}
.sheet .sub{font-size:11px;color:var(--sub);margin-top:6px}
.sheet .body{font-size:13px;line-height:1.85;color:#4E4741;margin:14px 0}
.sheet .lbl{font-size:9.5px;letter-spacing:.2em;color:var(--faint);font-weight:600;margin:18px 0 8px}
.btn{height:46px;border:0;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.2s}
.btn .ico{width:15px;height:15px}
.btn.solid{background:var(--rose);color:#fff;box-shadow:0 14px 26px -18px rgba(201,81,111,.95)}
.btn.solid:hover{transform:translateY(-1px)}
.btn.ink{background:var(--ink);color:#fff}
.btn.line{background:rgba(255,255,255,.6);border:1px solid var(--line);color:var(--ink)}
.btn.line:hover{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts2{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:14px}
.field{margin-bottom:12px}
.field>span{display:block;font-size:9.5px;letter-spacing:.2em;color:var(--faint);font-weight:600;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;font-size:13px;border-radius:13px;
  border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--ink);outline:none;font-family:inherit;
  transition:border-color .2s,box-shadow .2s}
.field textarea{min-height:88px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus{border-color:rgba(201,81,111,.42);box-shadow:0 0 0 4px rgba(201,81,111,.07)}
.field .err{font-size:11px;color:#C0392B;margin-top:6px;display:none}
.field.bad input,.field.bad textarea{border-color:rgba(192,57,43,.5)}
.field.bad .err{display:block}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{height:33px;padding:0 13px;border-radius:10px;font-size:12px;cursor:pointer;
  background:rgba(255,255,255,.6);border:1px solid var(--line);color:#544C46;transition:.18s}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.switch{display:flex;align-items:center;gap:9px;font-size:12px;color:#544C46;cursor:pointer;user-select:none}
.switch i{width:36px;height:20px;border-radius:20px;background:rgba(33,30,27,.14);position:relative;transition:.22s}
.switch i::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;
  transition:.22s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on i{background:var(--rose)}
.switch.on i::after{left:18px}
.safe{margin-top:16px;padding:14px;border-radius:15px;background:rgba(239,228,219,.55);
  border:1px solid rgba(33,30,27,.06)}
.safe b{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;color:#5C4A42;margin-bottom:8px}
.safe b .ico{width:14px;height:14px;color:#8A7266}
.safe ul{padding-left:15px;font-size:11.5px;line-height:1.85;color:#5A5049}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;margin:14px 0}
.spec div{background:rgba(255,255,255,.66);padding:11px 13px}
.spec span{display:block;font-size:9px;letter-spacing:.16em;color:var(--faint);margin-bottom:4px}
.spec b{font-size:12px;font-weight:600}
.cmts{margin-top:6px;display:flex;flex-direction:column;gap:10px}
.cm{display:flex;gap:9px;align-items:flex-start}
.cm .avatar{width:24px;height:24px;font-size:10px}
.cm div{font-size:12px;line-height:1.7;color:#514A44}
.cm div b{font-size:11.5px;color:var(--ink);display:block;font-weight:600}
.cm-in{display:flex;gap:8px;margin-top:12px}
.cm-in input{flex:1;height:42px;padding:0 14px;border-radius:12px;font-size:12.5px;outline:none;
  border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--ink)}
.cm-in button{width:42px;height:42px;border:0;border-radius:12px;background:var(--ink);color:#fff;display:grid;
  place-items:center;cursor:pointer}
.cm-in button .ico{width:15px;height:15px}
.empty{text-align:center;padding:52px 0;color:var(--faint);font-size:12px;line-height:2}
.empty .ico{width:26px;height:26px;margin:0 auto 12px;stroke-width:1.2;color:#D3CAC1}

/* ---------- mine / safety ---------- */
.card-lg{border-radius:var(--r);padding:20px;background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 16px 40px -32px rgba(70,40,25,.5)}
.idcard{display:flex;align-items:center;gap:14px}
.idcard .avatar{width:52px;height:52px;font-size:18px}
.idcard .me{flex:1;min-width:0}
.idcard h4{font-family:var(--serif);font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
.idcard h4 .ico{width:15px;height:15px;color:var(--rose)}
.idcard p{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.6}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.stats3 div{background:rgba(255,255,255,.55);border:1px solid var(--stroke);border-radius:15px;padding:14px;
  text-align:center}
.stats3 b{display:block;font-size:22px;font-weight:200;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stats3 span{font-size:9.5px;letter-spacing:.14em;color:var(--faint)}
.list{display:flex;flex-direction:column;gap:10px}
.row-item{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:14px;
  background:rgba(255,255,255,.56);border:1px solid rgba(255,255,255,.8)}
.row-item .t{flex:1;min-width:0}
.row-item b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item span{font-size:10.5px;color:var(--sub)}
.row-item .code{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.06em;
  padding:4px 8px;border-radius:7px;background:var(--rose-soft);color:#A8465F}
.mini{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.7);
  font-size:11px;color:#5A524C;cursor:pointer}
.mini:hover{background:#fff}
.shead{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.3px;line-height:1.4;margin:6px 0 4px}
.slead{font-size:12.5px;color:var(--sub);line-height:1.8;margin-bottom:16px}
.slist{display:flex;flex-direction:column;gap:12px}
.scard{padding:17px 18px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.scard h5{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.scard h5 .n{width:20px;height:20px;border-radius:7px;background:var(--rose-soft);color:#A8465F;
  display:grid;place-items:center;font-size:10px;font-weight:600;flex:0 0 auto}
.scard p{font-size:12px;line-height:1.8;color:#5A524C}
.tiny{font-size:10.5px;color:var(--faint);letter-spacing:.02em;margin-top:14px;line-height:1.8}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:96px;z-index:99;transform:translate(-50%,14px);
  padding:11px 18px;border-radius:12px;font-size:12px;color:#fff;background:rgba(33,30,27,.92);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;
  transition:.28s;max-width:82%;text-align:center;line-height:1.6}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
  header{padding:16px 16px 10px}
  .brand b{font-size:18px}
  .brand i{display:none}
  .searchbar{padding:0 16px 10px}
  .searchbar .ico{left:30px}
  .strip{padding:2px 16px 12px}
  .hint-swipe{padding:0 16px 6px}

function load(k,d){ try{ const v=localStorage.getItem(KEY+'.'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }

const $=function(s){ return document.querySelector(s); };
const esc=function(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
function toast(m){ const t=$('#toast'); t.innerHTML=m; t.classList.add('on'); clearTimeout(t._h);
  t._h=setTimeout(function(){ t.classList.remove('on'); },2200); }
function initials(n){ return (n||'匿').replace(/^匿名.*$/,'匿').slice(0,1); }
function gradFor(n){ let h=0; for(let i=0;i<(n||'').length;i++) h=(h*31+n.charCodeAt(i))%GRADS.length; return GRADS[h]; }
const RISK=['预付','定金','转账','二维码','扫码付','加微信','加V','加v','先付款','押金','付款后发货','链接支付','红包','付款码'];
/* 带否定语境的命中不算风险：「不用预付」「不接受转账」「别发红包」 */
function riskHits(text){
  for(let k=0;k<RISK.length;k++){
    const w=RISK[k]; let i=text.indexOf(w);
    while(i>-1){
      const before=text.slice(Math.max(0,i-3),i);
      if(!/[不别勿拒没无免]/.test(before)) return w;
      i=text.indexOf(w,i+1);
    }
  }
  return null;
}

function filtered(){
  return S.posts.filter(function(p){
    const okCat = S.cat==='全部' || p.cat===S.cat;
    const q=S.q.toLowerCase();
    const okQ = !q || (p.title+p.body+p.au+p.cat).toLowerCase().indexOf(q)>-1;
    return okCat && okQ;
  });
}

function postCard(p){
  const liked=S.me.likes.indexOf(p.id)>-1;
  const cIcon = (CATS.find(function(c){ return c.k===p.cat; })||{i:'grid'}).i;
  const art = (p.art===null||p.art===undefined) ? ''
    : `<div class="thumb" style="background:${ART[p.art%ART.length]}">
         <span class="tlabel">${p.cat}</span><span class="tmark">${svg(cIcon)}</span>
       </div>`;
  return `<article class="post" data-pid="${p.id}">
    <div class="who">
      <div class="avatar" style="background:${gradFor(p.au)}">${initials(p.au)}</div>
      <div class="nm">

    </div>
  </article>`;
}

      : '<div class="row-item"><div class="t"><span>还没有举报记录。看到可疑内容，在详情里点举报。</span></div></div>'}
  </div>
  <div class="tiny">这是一个前端演示版本：认证、接单、举报都存在本机浏览器，用于验证流程与交互。接微信云开发后，认证走服务端校验，举报进入审核队列。</div>`;
}

function render(){

/* ================= 轮播（可拖动） ================= */
function bindCarousel(){
  const car=$('#car'), track=$('#carTrack'); if(!car) return;
  const n=track.children.length;
  let x0=0, dx=0, down=false, w=car.clientWidth;
  function go(i,animate){
    S.slide=(i+n)%n;
    track.style.transition=animate===false?'none':'transform .52s cubic-bezier(.22,1,.36,1)';
    track.style.transform='translateX('+(-S.slide*w)+'px)';
    document.querySelectorAll('#dots i').forEach(function(d,k){ d.classList.toggle('on',k===S.slide); });
  }
  go(S.slide,false);
  car.addEventListener('pointerdown',function(e){
    if(e.target.closest('[data-act]')) return;
    down=true; x0=e.clientX; dx=0; w=car.clientWidth; track.style.transition='none';
    try{ car.setPointerCapture(e.pointerId); }catch(err){}
  });
  car.addEventListener('pointermove',function(e){
    if(!down) return;
    dx=e.clientX-x0;
    track.style.transform='translateX('+(-S.slide*w+dx)+'px)';
  });
  function up(){
    if(!down) return;
    down=false;
    if(Math.abs(dx)>w*0.18) go(S.slide+(dx<0?1:-1)); else go(S.slide);
  }
  car.addEventListener('pointerup',up);
  car.addEventListener('pointercancel',up);
  document.querySelectorAll('[data-dot]').forEach(function(d){
    d.onclick=function(){ go(parseInt(d.dataset.dot,10)); };
  });
  clearInterval(window._carTimer);
  window._carTimer=setInterval(function(){ if(S.view==='wall') go(S.slide+1); }, 5200);
}

/* ================= 分类条：拖动 + 惯性 ================= */
function bindStrip(){
  const el=$('#strip');
  let down=false, x0=0, sl=0, moved=0, v=0, last=0, raf=null;
  el.addEventListener('pointerdown',function(e){
    down=true; x0=e.clientX; sl=el.scrollLeft; moved=0; v=0; last=e.clientX;
    el.classList.add('dragging'); cancelAnimationFrame(raf);
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener('pointermove',function(e){
    if(!down) return;
    const dx=e.clientX-x0; moved=Math.max(moved,Math.abs(dx));
    el.scrollLeft=sl-dx;
    v=e.clientX-last; last=e.clientX;
  });
  function release(){
    if(!down) return; down=false; el.classList.remove('dragging');
    (function inertia(){
      v*=0.92; if(Math.abs(v)<0.6) return;
      el.scrollLeft-=v; raf=requestAnimationFrame(inertia);
    })();
  }
  el.addEventListener('pointerup',release);
  el.addEventListener('pointercancel',release);
  el.addEventListener('click',function(e){
    if(moved>7){ e.preventDefault(); e.stopPropagation(); }
  },true);
}

      </ul>
    </div>

function takeAndShow(p){

  S.orders.unshift({pid:p.id,title:p.title,au:p.au,price:p.price,code:code,at:'刚刚',status:'待面交'});
  saveAll();
  openSheet(`
    <div class="grab"></div>
    <div class="eyebrow" style="font-size:9.5px;letter-spacing:.26em;color:var(--sub)">接单成功 · 面交凭证</div>

function openReport(id){
  const p=S.posts.find(function(x){ return x.id===id; });
  const reasons=['疑似诈骗 / 要求预付','虚假信息 / 货不对板','骚扰或不当言论','其他'];
  openSheet(`
    <div class="grab"></div>
    <h3>举报这条内容</h3>
    <p class="sub">${esc(p.title)}</p>
    <div class="lbl">选择理由</div>
    <div class="list">
      ${reasons.map(function(r,i){ return `<div class="row-item" data-reason="${i}">
        <div class="t"><b>${r}</b></div>${svg('chev')}</div>`; }).join('')}
    </div>
    <div class="tiny">举报后内容会从墙上收起并进入人工审核，24 小时内处理。恶意举报同样会被记录。</div>
  `);
  document.querySelectorAll('[data-reason]').forEach(function(el){
    el.onclick=function(){
      const r=reasons[parseInt(el.dataset.reason,10)];

      S.posts=S.posts.filter(function(x){ return x.id!==id; });
      saveAll(); closeSheet(); render(); toast('已提交举报 · 审核中，24 小时内处理');

}

function openVerify(hint){
  openSheet(`
    <div class="grab"></div>
    <h3>在校生认证</h3>
    <p class="sub">${hint||'认证后才能接单，发布内容会带认证标识'}</p>
    <div class="safe" style="margin-top:14px">
      <b>${svg('lock')}我们只核验，不展示</b>
      <ul><li>学号只用于比对在校名册，不显示给任何人。</li>
      <li>校园卡后四位用于确认卡在你手上。</li>
      <li>认证结果只对外显示“已认证在校生”这五个字。</li></ul>
    </div>
    <div style="margin-top:16px">
      <div class="field" id="fName"><span>真实姓名</span><input id="vName" placeholder="与校园卡一致" value="${esc(S.me.school||'')}"><div class="err">请填写真实姓名</div></div>
      <div class="field" id="fSid"><span>学号</span><input id="vSid" placeholder="8–12 位数字" inputmode="numeric"><div class="err">学号应为 8–12 位数字</div></div>
      <div class="field" id="fCard"><span>校园卡后四位</span><input id="vCard" placeholder="4 位数字" inputmode="numeric" maxlength="4"><div class="err">请填 4 位数字</div></div>
    </div>
    <button class="btn solid" id="vGo" style="width:100%">${S.me.verified?'重新核验':'提交认证'}</button>
    <div class="tiny">演示版：校验只在本机进行，填任意合规格式即可通过。真实版本走学校统一身份或云函数校验。</div>
  `);
  $('#vGo').onclick=function(){
    const n=$('#vName').value.trim(), sid=$('#vSid').value.trim(), card=$('#vCard').value.trim();
    let bad=false;
    $('#fName').classList.toggle('bad', n.length<2); if(n.length<2) bad=true;
    $('#fSid').classList.toggle('bad', !/^\d{8,12}$/.test(sid)); if(!/^\d{8,12}$/.test(sid)) bad=true;
    $('#fCard').classList.toggle('bad', !/^\d{4}$/.test(card)); if(!/^\d{4}$/.test(card)) bad=true;
    if(bad) return;
    S.me.verified=true; S.me.name=n; S.me.school=n;
    S.posts.forEach(function(p){ if(p.by==='me') p.verified=true; });
    saveAll(); closeSheet(); render(); toast('认证通过 · 现在可以接单了');
  };
}

function openPublish(){
  const cats=['二手书','竞赛','课程','闲置','搭子','求助'];
  openSheet(`
    <div class="grab"></div>
    <h3>发一条到校园墙</h3>
    <p class="sub">${S.me.verified?'已认证 · 会带认证标识':'未认证也能发，但会标未认证、且不能接单'}</p>

    <div class="lbl">类型</div>
    <div class="seg" id="pSeg">${cats.map(function(c){
      return `<button data-c="${c}" class="${S.draft.cat===c?'on':''}">${c}</button>`; }).join('')}</div>

    <div class="lbl">标题</div>
    <div class="field" id="fTitle"><input id="pTitle" maxlength="40" placeholder="一句话说清是什么，比如“高数同济第七版 30 块带走”"><div class="err">标题至少 4 个字</div></div>

    <div class="lbl">详细一点</div>
    <div class="field" id="fBody"><textarea id="pBody" maxlength="400" placeholder="成色、时间、地点、能不能验货。写得越具体，越容易成交。"></textarea><div class="err">至少写 8 个字，方便对方判断</div></div>

    <div class="lbl">价格与地点</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field" id="fPrice"><input id="pPrice" inputmode="decimal" placeholder="价格，免费留空"><div class="err">价格应为数字</div></div>
      <div class="field" id="fPlace"><input id="pPlace" maxlength="16" placeholder="地点，如本部三食堂"><div class="err"></div></div>
    </div>

    <label class="switch" id="pAnon"><i></i>匿名发布（不显示昵称，仍显示是否认证）</label>

    <div class="safe" style="margin-top:16px">
      <b>${svg('shield')}发布前请确认</b>
      <ul>
        <li>信息真实，物品在手上、竞赛确实在招人。</li>
        <li>不接受预付与定金，只在校园公共区面交。</li>
        <li>不发付款码、不引到站外私聊。</li>
      </ul>
    </div>
    <label class="switch" id="pPromise" style="margin-top:14px"><i></i>我承诺以上信息真实，并遵守安全规则</label>

    <button class="btn solid" id="pGo" style="width:100%;margin-top:16px">${svg('send')}发布</button>
    <div class="tiny">发布后会立刻出现在墙上，可在「我的 · 我发布的」里下架。</div>
  `);
  let anon=false, promise=false;
  $('#pSeg').onclick=function(e){ const b=e.target.closest('button'); if(!b) return;
    S.draft.cat=b.dataset.c;
    document.querySelectorAll('#pSeg button').forEach(function(x){ x.classList.toggle('on', x.dataset.c===b.dataset.c); }); };
  $('#pAnon').onclick=function(){ anon=!anon; this.classList.toggle('on',anon); };
  $('#pPromise').onclick=function(){ promise=!promise; this.classList.toggle('on',promise); };
  $('#pGo').onclick=function(){
    const title=$('#pTitle').value.trim(), body=$('#pBody').value.trim();
    const priceRaw=$('#pPrice').value.trim(), place=$('#pPlace').value.trim();
    let bad=false;
    $('#fTitle').classList.toggle('bad', title.length<4); if(title.length<4) bad=true;
    $('#fBody').classList.toggle('bad', body.length<8); if(body.length<8) bad=true;
    const priceOk = priceRaw==='' || /^\d+(\.\d{1,2})?$/.test(priceRaw);
    $('#fPrice').classList.toggle('bad', !priceOk); if(!priceOk) bad=true;
    if(bad){ toast('还有必填项没填对'); return; }
    const joined=title+' '+body;
    const hit=riskHits(joined);
    if(hit){ toast('内容里有「'+hit+'」，平台不允许预付或站外转账，改一下再发'); return; }
    if(!promise){ toast('请先勾选“信息真实并遵守安全规则”'); return; }
    const id='n'+Date.now();
    S.posts.unshift({id:id,cat:S.draft.cat,au: anon? '匿名同学' : (S.me.name||'我'),
      title:title, body:body, price: priceRaw? parseFloat(priceRaw):0, place: place||'面议',
      ago:'刚刚', verified:S.me.verified, likes:0, art:null, cm:[], by:'me'});
    saveAll(); closeSheet(); S.view='wall'; S.cat='全部'; S.q=''; renderStrip(); render();
    const el=document.querySelector('[data-pid="'+id+'"]');
    if(el){ el.classList.add('flash'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
    toast(anon? '已匿名发布 · 出现在墙上最前面' : '发布成功 · 已出现在墙上');
  };
}

/* ================= 事件接线 ================= */
document.addEventListener('click',function(e){
  const t=e.target;
  const cat=t.closest('[data-cat]');
  if(cat){ S.cat=cat.dataset.cat; renderStrip(); render(); return; }
  const like=t.closest('[data-like]');
  if(like){
    const id=like.dataset.like, i=S.me.likes.indexOf(id);
    if(i>-1) S.me.likes.splice(i,1); else S.me.likes.push(id);
    like.classList.add('pop'); saveAll(); render(); return;
  }
  const take=t.closest('[data-take]');
  if(take){ e.stopPropagation(); const id=take.dataset.take;
    const p=S.posts.find(function(x){ return x.id===id; }); if(!p) return;
    takeAndShow(p); return;
  }
  const open=t.closest('[data-pid]');
  if(open && !t.closest('button')){ openPost(open.dataset.pid); return; }
  const openB=t.closest('[data-open]');
  if(openB){ openPost(openB.dataset.open); return; }
  const del=t.closest('[data-del]');
  if(del){ S.posts=S.posts.filter(function(x){ return x.id!==del.dataset.del; }); saveAll(); render();
    toast('已下架'); return; }
  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='publish') openPublish();
    else if(a==='verify') openVerify();
    else if(a==='safety'){ S.view='safety'; render(); }
    else if(a.indexOf('cat:')===0){ S.cat=a.slice(4); renderStrip(); S.view='wall'; render(); }
    return;
  }
});
$('#bnav').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(!b) return;
  const v=b.dataset.v;
  if(v==='publish'){ openPublish(); return; }
  S.view=v; render();
});
$('#searchToggle').onclick=function(){
  const w=$('#searchWrap');
  const show=w.style.display==='none';
  w.style.display=show?'block':'none';
  if(show) $('#q').focus();
};
$('#verifyPill').onclick=function(){ openVerify(); };
$('#q').addEventListener('input',function(e){
  S.q=e.target.value.trim();
  if(S.view!=='wall'){ S.view='wall'; }
  render();
});

paintIcons(document);
bindStrip();
renderStrip();
render();

  localStorage.setItem(KEY+'.seen','1');
  setTimeout(function(){ toast('左右拖动分类条看看 · 点加号就能发布'); },700);
}
