<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5">
<title>校园π · 校园信息聚合</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#F7F7F5;
  --ink:#101012;
  --sub:#8C8C87;
  --faint:#B4B4AE;
  --line:rgba(16,16,18,.09);
  --glass:rgba(255,255,255,.58);
  --glass-2:rgba(255,255,255,.42);
  --stroke:rgba(255,255,255,.72);
  --acc:#2F4BFF;
  --r:20px;
  --shadow:0 18px 44px -30px rgba(18,20,40,.55);
  --blur:saturate(165%) blur(22px);
}
html,body{height:100%;overflow-x:hidden}
body{
  font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink); background:var(--paper); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:-10%;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 460px at 12% -6%, #D6E0FF 0%, rgba(214,224,255,0) 64%),
    radial-gradient(560px 420px at 90% 2%, #FFD9E7 0%, rgba(255,217,231,0) 60%),
    radial-gradient(760px 560px at 62% 104%, #D5F0E4 0%, rgba(213,240,228,0) 64%),
    radial-gradient(440px 340px at 32% 62%, #E8DEFF 0%, rgba(232,222,255,0) 62%),
    var(--paper);
}
#app{position:relative;z-index:1;width:100%;max-width:1120px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;min-width:0}
.ico{width:16px;height:16px;flex:0 0 auto;display:block;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
header{display:flex;align-items:center;gap:16px;padding:20px 26px 12px;min-width:0}
.wordmark{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.wordmark b{font-size:17px;letter-spacing:-.4px;font-weight:600}
.wordmark span{font-size:8.5px;letter-spacing:.26em;color:var(--faint);font-weight:500}
.search{flex:1 1 auto;min-width:0;position:relative;max-width:420px}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{
  width:100%;height:42px;padding:0 14px 0 38px;font-size:13px;color:var(--ink);
  background:var(--glass);border:1px solid var(--stroke);border-radius:13px;outline:none;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:0 1px 0 rgba(255,255,255,.85) inset,var(--shadow);
  transition:border-color .22s,background .22s;
}
.search input::placeholder{color:var(--faint)}
.search input:focus{background:rgba(255,255,255,.78);border-color:rgba(47,75,255,.35)}
.ai-entry{
  margin-left:auto;height:42px;padding:0 16px;display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--ink);cursor:pointer;
  background:var(--glass);border:1px solid var(--stroke);border-radius:13px;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:0 1px 0 rgba(255,255,255,.85) inset,var(--shadow);transition:transform .2s,background .2s;
}
.ai-entry:hover{transform:translateY(-1px);background:rgba(255,255,255,.8)}
.ai-entry .ico{color:var(--acc)}

/* ---------- nav ---------- */
nav{display:flex;gap:24px;padding:0 26px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;min-width:0}
nav::-webkit-scrollbar{display:none}
nav button{
  position:relative;border:0;background:none;cursor:pointer;white-space:nowrap;
  padding:11px 0 13px;font-size:13px;letter-spacing:.01em;color:var(--sub);font-weight:500;
  transition:color .2s;
}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);font-weight:600}
nav button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--ink);
  animation:grow .34s cubic-bezier(.2,.9,.2,1)}
@keyframes grow{from{transform:scaleX(.25);opacity:0}to{transform:none;opacity:1}}

/* ---------- scroll area ---------- */
main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 96px;scroll-behavior:smooth}
main::-webkit-scrollbar{width:9px}
main::-webkit-scrollbar-thumb{background:rgba(16,16,18,.12);border-radius:9px;border:3px solid transparent;background-clip:content-box}

.panel{
  background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,var(--shadow);
}
/* ---------- hero ---------- */
.hero{padding:26px 26px 22px;margin-bottom:26px;border-radius:24px;position:relative;overflow:hidden;
  background:linear-gradient(140deg,rgba(255,255,255,.76),rgba(255,255,255,.4) 58%,rgba(255,255,255,.62));
  animation:rise .5s cubic-bezier(.2,.9,.2,1) both}
.hero::before{content:"";position:absolute;width:320px;height:320px;right:-70px;top:-140px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(47,75,255,.16),rgba(47,75,255,0) 68%);pointer-events:none}
.hero::after{content:"";position:absolute;width:260px;height:260px;left:-90px;bottom:-160px;border-radius:50%;
  background:radial-gradient(circle at 60% 40%,rgba(255,77,141,.13),rgba(255,77,141,0) 70%);pointer-events:none}
.hero .eyebrow{font-size:9.5px;letter-spacing:.26em;color:var(--faint);font-weight:600;margin-bottom:16px}
.hero h1{font-size:clamp(21px,2.4vw,27px);font-weight:600;letter-spacing:-.7px;line-height:1.3;max-width:14em}
.hero h1 em{font-style:normal;color:inherit;font-weight:600}
.nums{display:flex;gap:44px;margin:22px 0 20px;flex-wrap:wrap}
.nums div{display:flex;flex-direction:column;gap:2px}
.nums b{font-size:38px;font-weight:200;letter-spacing:-1.6px;font-variant-numeric:tabular-nums;line-height:1}
.nums span{font-size:10.5px;color:var(--sub);letter-spacing:.04em}
.hero-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line)}
.ghost-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:10px;
  font-size:12px;font-weight:500;color:var(--ink);cursor:pointer;
  background:rgba(255,255,255,.5);border:1px solid var(--stroke);transition:background .18s,transform .18s}
.ghost-btn:hover{background:#fff;transform:translateY(-1px)}
.ghost-btn .ico{color:var(--sub);width:14px;height:14px}
.hero-foot .note{margin-left:auto;font-size:10.5px;color:var(--faint);letter-spacing:.02em}

/* ---------- section ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 14px}
.sec h2{font-size:11px;letter-spacing:.22em;color:var(--ink);font-weight:600}
.sec .more{font-size:11px;color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  transition:color .18s}
.sec .more:hover{color:var(--ink)}
.sec .more .ico{width:13px;height:13px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;margin-bottom:26px}
.card{
  position:relative;display:flex;flex-direction:column;padding:16px;border-radius:18px;cursor:pointer;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.62),rgba(255,255,255,.34));border:1px solid var(--stroke);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,var(--shadow);
  transition:transform .3s cubic-bezier(.2,.9,.2,1),background .3s,border-color .3s;
  animation:rise .46s cubic-bezier(.2,.9,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.72);border-color:#fff}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 42%);opacity:.9}
.card>*{position:relative;z-index:1}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.14em;
  color:var(--sub);font-weight:600}
.kind .box{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--ink);
  background:rgba(255,255,255,.78);border:1px solid var(--stroke)}
.kind .box .ico{width:14px;height:14px;stroke-width:1.55}
.card h3{font-size:14px;font-weight:600;letter-spacing:-.3px;line-height:1.45;margin:11px 0 8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em;flex:0 0 auto}
.facts{display:flex;gap:10px;font-size:11px;color:var(--sub);flex-wrap:wrap;letter-spacing:.01em;
  margin-bottom:13px}
.row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;
  padding-top:12px;border-top:1px solid var(--line)}
.price{font-size:16px;font-weight:600;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.price small{font-size:10px;font-weight:500;color:var(--faint);margin-left:5px;text-decoration:line-through;
  font-variant-numeric:tabular-nums}
.price.free{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--sub)}
.seller{font-size:10.5px;color:var(--faint);letter-spacing:.01em}
.dot-hot{position:absolute;top:16px;right:16px;width:5px;height:5px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 3px rgba(47,75,255,.12)}

/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;z-index:40;background:rgba(16,16,18,.28);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .3s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:540px;margin:0 auto;
  padding:14px 22px 24px;border-radius:26px 26px 0 0;
  background:rgba(255,255,255,.82);border:1px solid #fff;border-bottom:0;
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 -24px 60px -34px rgba(16,16,18,.5);
  transform:translateY(104%);transition:transform .42s cubic-bezier(.16,1,.3,1);
  max-height:88dvh;overflow-y:auto;
}
.sheet.on{transform:none}
.grab{width:38px;height:3px;border-radius:3px;background:rgba(16,16,18,.14);margin:0 auto 16px}
.sheet h3{font-size:17px;font-weight:600;letter-spacing:-.4px;line-height:1.4;margin:12px 0 8px}
.sheet .desc{font-size:12.5px;line-height:1.8;color:#4a4a46;margin:14px 0 4px}
.sheet .big{display:flex;align-items:baseline;gap:8px;margin:14px 0 2px}
.sheet .big b{font-size:26px;font-weight:300;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.sheet .big s{font-size:11px;color:var(--faint)}
.sheet .big .save{font-size:10.5px;color:var(--acc);letter-spacing:.02em}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin:16px 0;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden}
.spec div{background:rgba(255,255,255,.6);padding:11px 13px}
.spec span{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--faint);margin-bottom:4px}
.spec b{font-size:12.5px;font-weight:600}
.acts{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;margin-top:6px}
.btn{height:48px;border:0;border-radius:13px;font-size:13px;font-weight:600;letter-spacing:.02em;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{transform:translateY(-1px);background:#000}
.btn.line{background:rgba(255,255,255,.6);color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{background:#fff}

/* ---------- AI ---------- */
.ai-wrap{display:flex;flex-direction:column;height:100%;gap:14px}
.ai-log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.bubble{max-width:82%;padding:12px 15px;border-radius:15px;font-size:12.8px;line-height:1.8;
  animation:rise .32s cubic-bezier(.2,.9,.2,1) both}
.bubble.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
.bubble.bot{align-self:flex-start;background:var(--glass);border:1px solid var(--stroke);border-bottom-left-radius:5px;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow)}
.bubble b{font-weight:600}
.quicks{display:flex;gap:7px;flex-wrap:wrap}
.quicks button{height:31px;padding:0 12px;border-radius:10px;font-size:11.5px;color:#4a4a46;cursor:pointer;
  background:rgba(255,255,255,.55);border:1px solid var(--stroke);transition:.18s}
.quicks button:hover{background:#fff;color:var(--ink)}
.ai-in{display:flex;gap:9px}
.ai-in input{flex:1;height:46px;padding:0 15px;font-size:13px;border-radius:13px;outline:none;
  background:rgba(255,255,255,.7);border:1px solid var(--stroke);color:var(--ink)}
.ai-in input:focus{border-color:rgba(47,75,255,.35)}
.ai-in button{width:46px;height:46px;border:0;border-radius:13px;background:var(--ink);color:#fff;
  display:grid;place-items:center;cursor:pointer;transition:.2s}
.ai-in button:hover{background:#000;transform:translateY(-1px)}
.typing span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--faint);margin-right:3px;
  animation:blink 1.1s infinite}
.typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ---------- doc ---------- */
.doc{padding:28px 30px;border-radius:var(--r);font-size:12.8px;line-height:1.95;color:#31312e}
.doc h1{font-size:18px;font-weight:600;letter-spacing:-.5px}
.doc .meta{font-size:10.5px;letter-spacing:.14em;color:var(--faint);margin:8px 0 4px}
.doc h2{font-size:11px;font-weight:600;letter-spacing:.2em;margin:26px 0 9px;padding-top:18px;
  border-top:1px solid var(--line)}
.doc p{color:#3d3d3a}
.doc ul{padding-left:16px;color:#3d3d3a}
.doc li{margin:3px 0}
.doc b{font-weight:600;color:var(--ink)}
.doc code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:rgba(16,16,18,.055);
  padding:1.5px 5px;border-radius:5px}
.doc table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11.5px}
.doc th,.doc td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
.doc th{font-size:9.5px;letter-spacing:.14em;color:var(--faint);font-weight:600}

/* ---------- mine ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stats .panel{padding:18px 16px}
.stats span{font-size:9.5px;letter-spacing:.16em;color:var(--faint);display:block;margin-bottom:8px}
.stats b{font-size:26px;font-weight:200;letter-spacing:-1.2px;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:56px 0;color:var(--faint);font-size:12px;letter-spacing:.02em}
.empty .ico{width:26px;height:26px;margin:0 auto 12px;stroke-width:1.2;color:#cfcfc9}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:88px;z-index:99;transform:translate(-50%,14px);
  padding:11px 18px;border-radius:12px;font-size:12px;letter-spacing:.02em;color:#fff;background:rgba(16,16,18,.9);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;transition:.28s}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:720px){
  header{padding:14px 16px 10px;gap:10px}
  header .search{max-width:none;min-width:0}
  header .search input{font-size:12.5px;padding-right:10px}
  .wordmark span{display:none}
  .ai-entry{padding:0 12px}
  .ai-entry span{display:none}
  nav{padding:0 16px;gap:18px;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 88%,transparent 100%);
    mask-image:linear-gradient(90deg,#000 0,#000 88%,transparent 100%)}
  main{padding:16px 16px 90px}
  .hero{padding:20px 18px 18px;border-radius:20px}
  .nums{gap:26px;margin:18px 0 16px}
  .nums b{font-size:30px}
  .hero-foot .note{display:none}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:12px;border-radius:15px}
  .card h3{font-size:12.5px;min-height:3.55em;letter-spacing:-.2px}
  .kind{font-size:9px;letter-spacing:.1em}
  .facts{font-size:10.5px;gap:7px}
  .price{font-size:14px}
  .seller{display:none}
  .doc{padding:20px 16px}
  .stats{gap:8px}
  .stats b{font-size:21px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="wordmark"><b>校园π</b><span>CAMPUS</span></div>
    <div class="search">
      <span data-icon="search" class="ico"></span>
      <input id="q" placeholder="搜书、竞赛、课程、闲置、搭子">
    </div>
    <button class="ai-entry" id="aiBtn"><span data-icon="spark"></span><span>AI 助手</span></button>
  </header>

  <nav id="nav">
    <button class="on" data-v="home">首页</button>
    <button data-v="book">二手书</button>
    <button data-v="match">竞赛</button>
    <button data-v="course">课程</button>
    <button data-v="goods">闲置</button>
    <button data-v="study">搭子</button>
    <button data-v="ai">AI</button>
    <button data-v="doc">PRD</button>
    <button data-v="mine">我的</button>
  </nav>

  <main id="view"></main>
</div>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
/* ============ 线性图标系统（自绘 24 网格，无系统 emoji / 无字符图标） ============ */
const ICONS = {
  book:'<path d="M12 6.6C10.4 5.2 8 4.5 5 4.5v13.4c3 0 5.4.7 7 2 1.6-1.3 4-2 7-2V4.5c-3 0-5.4.7-7 2.1Z"/><path d="M12 6.6v13.3"/>',
  flag:'<path d="M6.2 3.2v17.6"/><path d="M6.2 4.2h11.6l-2.2 4.2 2.2 4.2H6.2"/>',
  cap:'<path d="M2.4 9.2 12 5l9.6 4.2L12 13.4 2.4 9.2Z"/><path d="M6.2 11.2v3.9c0 1.7 2.6 3 5.8 3s5.8-1.3 5.8-3v-3.9"/><path d="M21.6 9.2v4.6"/>',
  bag:'<path d="M5.6 8h12.8l-1 12H6.6L5.6 8Z"/><path d="M9 8V6.2a3 3 0 0 1 6 0V8"/>',
  users:'<circle cx="9.6" cy="8" r="3.6"/><path d="M3.2 20v-1.4A4.4 4.4 0 0 1 7.6 14.2h4A4.4 4.4 0 0 1 16 18.6V20"/><path d="M16.4 4.6a3.4 3.4 0 0 1 0 6.4"/><path d="M20.8 20v-1.4a3.6 3.6 0 0 0-2.6-3.4"/>',
  spark:'<path d="M11 3.4 12.8 8.6 18 10.4 12.8 12.2 11 17.4 9.2 12.2 4 10.4 9.2 8.6 11 3.4Z"/><path d="M17.6 14.6l1 2.8 2.8 1-2.8 1-1 2.8-1-2.8-2.8-1 2.8-1 1-2.8Z"/>',
  search:'<circle cx="10.8" cy="10.8" r="6.6"/><path d="M20 20l-4.4-4.4"/>',
  arrow:'<path d="M4.5 12h14"/><path d="M13 6.5 18.5 12 13 17.5"/>',
  close:'<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',
  plus:'<path d="M12 5.2v13.6"/><path d="M5.2 12h13.6"/>',
  clock:'<circle cx="12" cy="12" r="8.4"/><path d="M12 7.6V12l3 1.8"/>',
  pin:'<path d="M12 20.6s6.4-5.2 6.4-10.2a6.4 6.4 0 1 0-12.8 0c0 5 6.4 10.2 6.4 10.2Z"/><circle cx="12" cy="10.2" r="2.3"/>',
  doc:'<path d="M6.6 3.2h7l4.8 4.8v12.8H6.6V3.2Z"/><path d="M13.4 3.2v5h4.8"/><path d="M9.6 13h5.6"/><path d="M9.6 16.4h3.8"/>',

/* ============ AI（规则检索；接真模型只替换 aiAnswer） ============ */
function aiAnswer(q){
  const s=q.toLowerCase();
  const m=s.match(/(\d+)\s*块|(\d+)\s*元|(\d+)\s*以内/);
  const cap=m?parseInt(m[1]||m[2]||m[3],10):null;
  let pool=DB.slice(), why=[];
  if(/书|教材|课本/.test(s)){ pool=pool.filter(function(d){return d.cat==='book';}); why.push('二手书'); }
  if(/竞赛|比赛|组队|学分/.test(s)){ pool=pool.filter(function(d){return d.cat==='match';}); why.push('竞赛'); }
  if(/课|证书|讲座/.test(s)){ pool=pool.filter(function(d){return d.cat==='course';}); why.push('课程'); }
  if(/搭子|考研|监督/.test(s)){ pool=pool.filter(function(d){return d.cat==='study';}); why.push('搭子'); }
  if(/闲置|冰箱|车|衣/.test(s)){ pool=pool.filter(function(d){return d.cat==='goods';}); why.push('闲置'); }
  if(/免费|白嫖|0\s*元/.test(s)){ pool=pool.filter(function(d){return d.price===0;}); why.push('免费'); }
  if(cap!==null){ pool=pool.filter(function(d){return d.price<=cap;}); why.push(cap+' 元以内'); }
  if(/值不值|值吗/.test(s)){
    return '判断只看三条：<br>1 · 成色与价差——九成新以上、价差超过五成才值得出手；<br>2 · 用得上几周——只用一学期的教材，买二手省 60% 以上；<br>3 · 面交成本——同校区自提才划算。<br>这条价差够，我建议收。要不要我顺手找同类的更低价？';
  }
  if(/规划|安排|这周/.test(s)){
    return '这周这样排，支出 41.9 元，其中两项可计学分：<br>1 · 周二前拿下《高等数学》¥32，面交，早点开始刷题<br>2 · 周三 19:00 去 A302 蓝桥杯集训，免费，零基础可来<br>3 · 周五前提交数学建模校内组队，剩余 3 天，还差 1 位<br>4 · 周末用线代串讲录播 ¥9.9 过一遍期末重点<br>要我直接帮你下单与报名吗？';
  }
  if(!pool.length) return '没有完全匹配的。放宽一点试试：<b>50 元以内的二手书</b>，或<b>能加学分的活动</b>，我重新筛一遍。';
  const top=pool.slice(0,3);
  return '按「'+(why.join(' + ')||'全部')+'」命中 <b>'+pool.length+'</b> 条，最值得看的三条：<br>'+
    top.map(function(d,i){ return (i+1)+' · <b>'+d.title+'</b>　'+(d.price?('¥'+d.price+(d.old?'（原价 ¥'+d.old+'）':'')):'免费')+'｜'+d.f.slice(0,2).join(' / '); }).join('<br>')+
    '<br>'+(pool.length>3?('另有 '+(pool.length-3)+' 条同类。'):'以上是全部。')+'要按最便宜排，还是按最新发布排？';
}
function askAI(){
  const i=$('#aiIn'); const q=i.value.trim(); if(!q) return;
  S.chats.push({r:'me',t:q});
  S.chats.push({r:'bot',typing:true});
  i.value=''; save(); render();
  setTimeout(function(){ S.chats[S.chats.length-1]={r:'bot',t:aiAnswer(q)}; save(); render(); },560);
}

paintIcons(document);
render();
</script>
