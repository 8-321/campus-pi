<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070B14">
<title>校园π · 校园墙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* —— 夜蓝玻璃：单一冷色系 + 一处冰蓝强调 —— */
  --bg:#070B14;
  --ink:#F1F6FE;
  --sub:#AFBED2;
  --faint:#8C9FB8;
  --rule:rgba(255,255,255,.10);
  --hair:rgba(255,255,255,.07);
  --acc:#8FB8FF;
  --acc-deep:#5E8BF2;
  --acc-ink:#06101F;
  --danger:#FF887B;
  --warn:#FFC46B;

  --g0:rgba(255,255,255,.042);
  --g1:rgba(255,255,255,.068);
  --g2:rgba(255,255,255,.10);
  --g3:rgba(255,255,255,.145);
  --edge:rgba(255,255,255,.13);
  --edge-hi:rgba(255,255,255,.26);

  --r:22px; --r-s:14px; --r-l:30px; --r-p:999px;
  --blur:blur(24px) saturate(180%);
  --blur-l:blur(40px) saturate(190%);
  --sh:inset 0 1px 0 rgba(255,255,255,.16), 0 28px 56px -30px rgba(0,0,0,.9);
  --acc-grad:linear-gradient(180deg,#A6C6FF 0%,#7098F4 100%);

  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
  --hh:64px;
}
/* 不要用 html,body{height:100%}：会让 body 变滚动容器，吸顶失效、scrollY 恒为 0 */
html{overflow-x:clip}
body{min-height:100dvh;overflow-x:clip;color:var(--ink);background:var(--bg);
  font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:.005em}

/* ---------- 背景：深空蓝 + 三团冷光 + 噪点（玻璃要有东西可折射） ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}
#bg::before{content:"";position:absolute;inset:-10%;
  background:
    radial-gradient(900px 760px at 4% -14%, rgba(58,116,214,.72) 0%, rgba(58,116,214,0) 64%),
    radial-gradient(760px 640px at 98% -6%, rgba(30,140,170,.52) 0%, rgba(30,140,170,0) 62%),
    radial-gradient(1200px 760px at 58% 114%, rgba(96,64,176,.42) 0%, rgba(96,64,176,0) 70%),
    radial-gradient(680px 560px at 22% 62%, rgba(44,92,172,.42) 0%, rgba(44,92,172,0) 68%),
    radial-gradient(560px 460px at 86% 44%, rgba(26,116,146,.42) 0%, rgba(26,116,146,0) 72%),
    radial-gradient(700px 300px at 50% 58%, rgba(40,84,158,.30) 0%, rgba(40,84,158,0) 74%)}
#bg::after{content:"";position:absolute;inset:0;opacity:.055;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
#app{position:relative;z-index:1;width:100%;max-width:1140px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;padding:0 18px 108px;background:transparent}
.ico{width:16px;height:16px;flex:0 0 auto;display:block;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 顶栏：悬浮玻璃条 ---------- */
header{position:sticky;top:0;z-index:20;padding:10px 0 0;background:transparent}
.mast{display:flex;align-items:center;gap:14px;padding:13px 16px;
  background:var(--g1);border:1px solid var(--edge);border-radius:var(--r-l);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--sh)}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:-.4px;line-height:1;
  text-shadow:0 1px 18px rgba(143,184,255,.35)}
.brand i{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.3em;color:var(--faint)}
.mast .meta{margin-left:auto;text-align:right;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  color:var(--faint);line-height:1.75}
.h-actions{display:flex;align-items:center;gap:8px;margin-left:16px}
.pill{height:34px;padding:0 13px;display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--edge);border-radius:var(--r-p);background:var(--g0);color:var(--sub);
  font-size:11.5px;font-weight:500;cursor:pointer;font-family:inherit;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:.16s}
.pill:hover{background:var(--g2);color:var(--ink);border-color:var(--edge-hi)}
.pill .ico{width:13px;height:13px;stroke-width:1.7}
.pill.ok{border-color:rgba(143,184,255,.55);color:var(--acc);background:rgba(143,184,255,.10)}
.pill.ok:hover{background:rgba(143,184,255,.18);color:var(--ink)}
.mast-rule{display:none}
.searchbar{position:relative;padding:8px 0 0;display:none}
.searchbar.on{display:block}
.searchbar input{width:100%;height:44px;padding:0 16px 0 38px;font-size:12.5px;color:var(--ink);
  background:var(--g1);border:1px solid var(--edge);border-radius:var(--r-p);outline:none;
  font-family:inherit;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);transition:.16s}
.searchbar input::placeholder{color:var(--faint)}
.searchbar input:focus{border-color:rgba(143,184,255,.6);background:var(--g2);
  box-shadow:0 0 0 4px rgba(143,184,255,.10)}
.searchbar .ico{position:absolute;left:15px;top:24px;color:var(--faint);width:14px;height:14px}

/* ---------- 分类条：横向滑动的玻璃药丸 ---------- */
.strip-wrap{position:sticky;top:var(--hh);z-index:19;padding:8px 0 0;background:transparent}
.strip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;cursor:grab;user-select:none;
  padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.strip.dragging{cursor:grabbing}
.chip{flex:0 0 auto;height:35px;padding:0 14px;border:1px solid var(--edge);border-radius:var(--r-p);
  background:var(--g0);color:var(--sub);font-size:12px;cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;font-family:inherit;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:.16s;white-space:nowrap}
.chip .ico{width:13px;height:13px;opacity:.7;stroke-width:1.7}
.chip:hover{color:var(--ink);background:var(--g2);border-color:var(--edge-hi)}
.chip.on{background:var(--acc-grad);color:var(--acc-ink);border-color:transparent;font-weight:600;
  box-shadow:0 8px 22px -12px rgba(143,184,255,.9)}
.chip.on .ico{opacity:1}
.hint-swipe{display:none}

/* ---------- 头条轮播 ---------- */
.car{margin:10px 0 0;border:1px solid var(--edge);border-radius:var(--r-l);overflow:hidden;
  touch-action:pan-y;position:relative;background:var(--g0);
  -webkit-backdrop-filter:var(--blur-l);backdrop-filter:var(--blur-l);box-shadow:var(--sh)}
.car::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(520px 300px at 8% -20%, rgba(143,184,255,.16), rgba(143,184,255,0) 70%),
             radial-gradient(420px 260px at 100% 120%, rgba(28,124,150,.18), rgba(28,124,150,0) 72%)}
.car-track{display:flex;transition:transform .34s cubic-bezier(.3,0,.2,1);will-change:transform;
  position:relative;z-index:1}
.slide{flex:0 0 100%;min-height:152px;padding:22px 26px 18px;display:flex;flex-direction:column;
  justify-content:space-between;background:transparent}
.slide .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--acc);
  display:flex;align-items:center;gap:8px}
.slide .eyebrow::before{content:"";width:18px;height:1px;background:var(--acc);opacity:.7}
.slide h2{font-family:var(--serif);font-size:clamp(21px,2.7vw,33px);font-weight:600;letter-spacing:-.6px;
  line-height:1.4;margin-top:10px;max-width:17em}
.slide .rowline{display:flex;align-items:flex-end;gap:38px;margin-top:18px;flex-wrap:wrap}
.slide .num b{display:block;font-family:var(--mono);font-size:29px;font-weight:400;letter-spacing:-1.2px;
  line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.slide .num span{display:block;margin-top:5px;font-size:10px;color:var(--faint);letter-spacing:.06em;
  white-space:nowrap}
.slide .cta{margin-left:auto;height:38px;padding:0 18px;border:0;border-radius:var(--r-p);
  background:var(--acc-grad);color:var(--acc-ink);font-size:12px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-family:inherit;
  white-space:nowrap;flex:0 0 auto;box-shadow:0 12px 26px -14px rgba(143,184,255,.95);transition:.16s}
.slide .cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
.slide .cta .ico{width:13px;height:13px;stroke-width:2}
.dots{display:flex;gap:6px;padding:0 26px 16px;position:relative;z-index:1}
.dots i{height:3px;flex:1;max-width:40px;border-radius:var(--r-p);background:rgba(255,255,255,.16);
  cursor:pointer;transition:background .2s}
.dots i.on{background:var(--acc);box-shadow:0 0 12px rgba(143,184,255,.7)}

/* ---------- 列表 ---------- */
main{flex:1;padding:0}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 0;padding:0 2px 9px;
  border-bottom:1px solid var(--hair)}
.sec h3{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.02em}
.sec .count{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--faint)}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:14px;
  padding:4px 0 6px;align-items:stretch}
.post{position:relative;padding:0;cursor:pointer;overflow:hidden;border-radius:var(--r);
  background:linear-gradient(180deg,rgba(255,255,255,.11) 0%,rgba(255,255,255,.052) 46%,rgba(255,255,255,.075) 100%);
  border:1px solid rgba(255,255,255,.155);box-shadow:var(--sh);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  display:flex;flex-direction:column;transition:background .18s,transform .18s,box-shadow .18s,border-color .18s}
.post:hover{background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.08) 52%,rgba(255,255,255,.10) 100%);
  border-color:rgba(255,255,255,.28);transform:translateY(-2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 34px 64px -30px rgba(0,0,0,.95)}
.ph{position:relative;margin:0;aspect-ratio:16/10;overflow:hidden;background:#0B1220}
.ph img{display:block;width:100%;height:100%;object-fit:cover;
  filter:saturate(.95) contrast(1.07) brightness(.8);transition:transform .6s cubic-bezier(.2,0,.2,1),filter .3s}
.post:hover .ph img{filter:saturate(1) contrast(1.05) brightness(.95)}
.post:hover .ph img{transform:scale(1.035)}
.ph::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,11,20,.42) 0%,rgba(7,11,20,.06) 46%,rgba(7,11,20,.55) 100%)}
.ptag{position:absolute;left:11px;top:11px;z-index:1;height:23px;padding:0 9px;display:inline-flex;
  align-items:center;font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--ink);
  background:rgba(10,16,28,.52);border:1px solid rgba(255,255,255,.22);border-radius:var(--r-p);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pbody{padding:15px 16px 0;display:flex;flex-direction:column;flex:1;min-width:0}
.post h4{font-family:var(--serif);font-size:15.5px;font-weight:600;line-height:1.5;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .txt{font-size:12.2px;line-height:1.75;color:var(--sub);margin-top:7px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.who{display:flex;align-items:center;gap:8px;margin:auto 0 0;padding-top:12px}
.avatar{width:25px;height:25px;display:grid;place-items:center;font-family:var(--serif);font-size:11.5px;
  border-radius:8px;border:1px solid var(--edge);background:var(--g2);color:var(--sub);flex:none}
.who .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.who .nm b{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .nm b .ico{width:11px;height:11px;color:var(--acc);stroke-width:1.9;flex:none}
.who .nm span{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tag{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--sub);
  border:1px solid var(--edge);padding:2px 7px;border-radius:var(--r-p);flex:none}
.post .foot{display:flex;align-items:center;gap:14px;margin-top:12px;padding:11px 16px 12px;
  border-top:1px solid var(--hair)}
.act{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  color:var(--faint);background:none;border:0;padding:0;cursor:pointer;transition:color .14s}
.act .ico{width:13px;height:13px;stroke-width:1.6}
.act:hover{color:var(--ink)}
.act.on{color:var(--acc)}
.act.on .ico{fill:rgba(143,184,255,.22)}
.price{margin-left:auto;font-family:var(--mono);font-size:14.5px;letter-spacing:-.3px;
  font-variant-numeric:tabular-nums;color:var(--acc)}
.price.free{font-size:9.5px;letter-spacing:.12em;color:var(--faint)}
.take{height:30px;padding:0 13px;border:1px solid var(--edge-hi);border-radius:var(--r-p);
  background:var(--g2);color:var(--ink);font-size:11px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;font-family:inherit;transition:.16s}
.take:hover{background:var(--acc-grad);color:var(--acc-ink);border-color:transparent}
.take .ico{width:12px;height:12px}

/* ---------- 底部悬浮 dock ---------- */
.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:30;height:62px;
  width:min(520px,calc(100% - 28px));display:flex;align-items:center;gap:2px;padding:6px;
  background:rgba(12,20,34,.62);border:1px solid var(--edge);border-radius:var(--r-p);
  -webkit-backdrop-filter:var(--blur-l);backdrop-filter:var(--blur-l);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 30px 60px -24px rgba(0,0,0,.95)}
.bnav button{flex:1;height:100%;border:0;border-radius:var(--r-p);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;padding:0 10px;
  font-family:inherit;font-size:11px;letter-spacing:.04em;color:var(--faint);transition:.16s}
.bnav button .ico{width:16px;height:16px}
.bnav button:hover{color:var(--ink);background:var(--g1)}
.bnav button.on{color:var(--ink);background:var(--g3)}
.bnav .fab-btn{flex:0 0 58px}
.bnav .fab{width:46px;height:46px;border-radius:var(--r-p);background:var(--acc-grad);
  color:var(--acc-ink);display:grid;place-items:center;
  box-shadow:0 14px 30px -12px rgba(143,184,255,.95),inset 0 1px 0 rgba(255,255,255,.5);
  transition:.18s}
.bnav .fab-btn:hover .fab{transform:translateY(-2px) scale(1.04);filter:brightness(1.05)}
.fab .ico{width:19px;height:19px;stroke-width:2.2}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;z-index:40;background:rgba(4,8,16,.62);opacity:0;pointer-events:none;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{--sp:22px;position:fixed;left:0;right:0;bottom:0;z-index:50;width:min(640px,100%);margin:0 auto;
  max-height:92dvh;overflow-y:auto;padding:0 var(--sp) 26px;border-radius:var(--r-l) var(--r-l) 0 0;
  background:rgba(14,22,38,.86);border:1px solid var(--edge);border-bottom:0;
  -webkit-backdrop-filter:var(--blur-l);backdrop-filter:var(--blur-l);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 -30px 70px -30px rgba(0,0,0,.95);
  transform:translateY(101%);transition:transform .3s cubic-bezier(.3,0,.2,1)}
.sheet.on{transform:none}
.sheet .grab{display:block;width:42px;height:4px;border-radius:var(--r-p);background:rgba(255,255,255,.22);
  margin:10px auto 2px}
.sheet h3{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.3px;line-height:1.45;
  margin:16px 0 6px}
.sheet .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--faint);margin-top:4px}
.sheet .body{font-size:13px;line-height:1.95;color:var(--sub);margin:14px 0}
.sheet .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--faint);
  margin:22px 0 9px}
.btn{height:46px;border:1px solid var(--edge);border-radius:var(--r-p);font-size:12.5px;font-weight:500;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-family:inherit;color:var(--ink);background:var(--g1);transition:.16s}
.btn .ico{width:14px;height:14px}
.btn.solid{background:var(--acc-grad);color:var(--acc-ink);border-color:transparent;font-weight:600;
  box-shadow:0 14px 30px -16px rgba(143,184,255,.95)}
.btn.solid:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.ink{background:var(--acc-grad);color:var(--acc-ink);border-color:transparent;font-weight:600}
.btn.line{background:var(--g0);color:var(--ink)}
.btn.line:hover{background:var(--g2);border-color:var(--edge-hi)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.sheet .acts2{position:sticky;bottom:-1px;z-index:2;margin:18px calc(-1 * var(--sp)) -26px;
  padding:12px var(--sp) calc(18px + env(safe-area-inset-bottom));
  border-top:1px solid var(--hair);
  background:linear-gradient(180deg,rgba(14,22,38,0) 0%,rgba(14,22,38,.9) 40%,rgba(11,18,31,.97) 100%);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.field{margin-bottom:13px}
.field>span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--faint);
  margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;font-size:12.5px;color:var(--ink);
  border:1px solid var(--edge);border-radius:var(--r-s);background:var(--g0);outline:none;
  font-family:inherit;transition:.16s}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
.field textarea{min-height:88px;resize:vertical;line-height:1.85}
.field input:focus,.field textarea:focus{border-color:rgba(143,184,255,.6);background:var(--g1);
  box-shadow:0 0 0 4px rgba(143,184,255,.10)}
.field .err{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--danger);
  margin-top:6px;display:none}
.field.bad input,.field.bad textarea{border-color:var(--danger)}
.field.bad .err{display:block}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{height:34px;padding:0 13px;border:1px solid var(--edge);border-radius:var(--r-p);
  background:var(--g0);color:var(--sub);font-size:11.5px;cursor:pointer;font-family:inherit;transition:.16s}
.seg button:hover{color:var(--ink);background:var(--g2)}
.seg button.on{background:var(--acc-grad);color:var(--acc-ink);border-color:transparent;font-weight:600}
.switch{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);cursor:pointer;
  margin-top:14px;user-select:none}
.switch i{width:18px;height:18px;border:1px solid var(--edge-hi);border-radius:6px;position:relative;
  flex:0 0 auto;background:var(--g0);transition:.16s}
.switch.on i{background:var(--acc-grad);border-color:transparent}
.switch.on i::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;
  border-right:2px solid var(--acc-ink);border-bottom:2px solid var(--acc-ink);transform:rotate(40deg)}
.ph-detail{position:relative;margin:14px 0 0;aspect-ratio:16/10;overflow:hidden;border-radius:var(--r);
  border:1px solid var(--edge);background:#0B1220}
.ph-detail img{display:block;width:100%;height:100%;object-fit:cover;
  filter:saturate(.95) contrast(1.06) brightness(.88)}
.safe{margin-top:16px;padding:13px 15px;border:1px solid var(--edge);

/* 带否定语境的命中不算风险：「不用预付」「不接受转账」「别发红包」 */
function riskHits(text){
  for(let k=0;k<RISK.length;k++){
    const w=RISK[k]; let i=text.indexOf(w);
    while(i>-1){
      const before=text.slice(Math.max(0,i-3),i);
      if(!/[不别勿拒没无免]/.test(before)) return w;
      i=text.indexOf(w,i+1);
    }
  }
  return null;
}

/* ================= 轮播（可拖动） ================= */
function bindCarousel(){
  const car=$('#car'), track=$('#carTrack');
let _carHover=false;
car.addEventListener('pointerenter', function(){ _carHover=true; });
car.addEventListener('pointerleave', function(){ _carHover=false; }); if(!car) return;
  const n=track.children.length;
  let x0=0, dx=0, down=false, w=car.clientWidth;
  function go(i,animate){
    S.slide=(i+n)%n;
    track.style.transition=animate===false?'none':'transform .52s cubic-bezier(.22,1,.36,1)';
    track.style.transform='translateX('+(-S.slide*w)+'px)';
    document.querySelectorAll('#dots i').forEach(function(d,k){ d.classList.toggle('on',k===S.slide); });
  }
  go(S.slide,false);
  car.addEventListener('pointerdown',function(e){
    if(e.target.closest('[data-act]')) return;
    down=true; x0=e.clientX; dx=0; w=car.clientWidth; track.style.transition='none';
    try{ car.setPointerCapture(e.pointerId); }catch(err){}
  });
  car.addEventListener('pointermove',function(e){
    if(!down) return;
    dx=e.clientX-x0;
    track.style.transform='translateX('+(-S.slide*w+dx)+'px)';
  });
  function up(){
    if(!down) return;
    down=false;
    if(Math.abs(dx)>w*0.18) go(S.slide+(dx<0?1:-1)); else go(S.slide);
  }
  car.addEventListener('pointerup',up);
  car.addEventListener('pointercancel',up);
  document.querySelectorAll('[data-dot]').forEach(function(d){
    d.onclick=function(){ go(parseInt(d.dataset.dot,10)); };
  });
  clearInterval(window._carTimer);
  window._carTimer=setInterval(function(){ if(S.view==='wall' && !document.hidden && !_carHover) go(S.slide+1); }, 6500);
}

/* ================= 分类条：拖动 + 惯性 ================= */
function bindStrip(){
  const el=$('#strip');
  let down=false, x0=0, sl=0, moved=0, v=0, last=0, raf=null;
  el.addEventListener('pointerdown',function(e){
    down=true; x0=e.clientX; sl=el.scrollLeft; moved=0; v=0; last=e.clientX;
    el.classList.add('dragging'); cancelAnimationFrame(raf);
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener('pointermove',function(e){
    if(!down) return;
    const dx=e.clientX-x0; moved=Math.max(moved,Math.abs(dx));
    el.scrollLeft=sl-dx;
    v=e.clientX-last; last=e.clientX;
  });
  function release(){
    if(!down) return; down=false; el.classList.remove('dragging');
    (function inertia(){
      v*=0.92; if(Math.abs(v)<0.6) return;
      el.scrollLeft-=v; raf=requestAnimationFrame(inertia);
    })();
  }
  el.addEventListener('pointerup',release);
  el.addEventListener('pointercancel',release);
  el.addEventListener('click',function(e){
    if(moved>7){ e.preventDefault(); e.stopPropagation(); }
  },true);
}

    </div>
    <div style="margin-top:16px">
      <div class="field" id="fName"><span>真实姓名</span><input id="vName" placeholder="与校园卡一致" value="${esc(S.me.school||'')}"><div class="err">请填写真实姓名</div></div>
      <div class="field" id="fSid"><span>学号</span><input id="vSid" placeholder="8–12 位数字" inputmode="numeric"><div class="err">学号应为 8–12 位数字</div></div>
      <div class="field" id="fCard"><span>校园卡后四位</span><input id="vCard" placeholder="4 位数字" inputmode="numeric" maxlength="4"><div class="err">请填 4 位数字</div></div>
    </div>
    <button class="btn solid" id="vGo" style="width:100%">${S.me.verified?'重新核验':'提交认证'}</button>
    <div class="tiny">演示版：校验只在本机进行，填任意合规格式即可通过。真实版本走学校统一身份或云函数校验。</div>
  `);
  $('#vGo').onclick=function(){
    const n=$('#vName').value.trim(), sid=$('#vSid').value.trim(), card=$('#vCard').value.trim();
    let bad=false;
    $('#fName').classList.toggle('bad', n.length<2); if(n.length<2) bad=true;
    $('#fSid').classList.toggle('bad', !/^\d{8,12}$/.test(sid)); if(!/^\d{8,12}$/.test(sid)) bad=true;
    $('#fCard').classList.toggle('bad', !/^\d{4}$/.test(card)); if(!/^\d{4}$/.test(card)) bad=true;
    if(bad) return;
    S.me.verified=true; S.me.name=n; S.me.school=n;
    S.posts.forEach(function(p){ if(p.by==='me') p.verified=true; });
    saveAll(); closeSheet(); render(); toast('认证通过 · 现在可以接单了');
  };
}

function openPublish(){
  const cats=['二手书','竞赛','课程','闲置','搭子','求助'];
  openSheet(`
    <div class="grab"></div>
    <h3>发一条到校园墙</h3>
    <p class="sub">${S.me.verified?'已认证 · 会带认证标识':'未认证也能发，但会标未认证、且不能接单'}</p>

    <div class="lbl">类型</div>
    <div class="seg" id="pSeg">${cats.map(function(c){
      return `<button data-c="${c}" class="${S.draft.cat===c?'on':''}">${c}</button>`; }).join('')}</div>

    <div class="lbl">标题</div>
    <div class="field" id="fTitle"><input id="pTitle" maxlength="40" placeholder="一句话说清是什么，比如“高数同济第七版 30 块带走”"><div class="err">标题至少 4 个字</div></div>

    <div class="lbl">详细一点</div>
    <div class="field" id="fBody"><textarea id="pBody" maxlength="400" placeholder="成色、时间、地点、能不能验货。写得越具体，越容易成交。"></textarea><div class="err">至少写 8 个字，方便对方判断</div></div>

    <div class="lbl">价格与地点</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field" id="fPrice"><input id="pPrice" inputmode="decimal" placeholder="价格，免费留空"><div class="err">价格应为数字</div></div>
      <div class="field" id="fPlace"><input id="pPlace" maxlength="16" placeholder="地点，如本部三食堂"><div class="err"></div></div>
    </div>

    <label class="switch" id="pAnon"><i></i>匿名发布（不显示昵称，仍显示是否认证）</label>

    <div class="safe" style="margin-top:16px">
      <b>${svg('shield')}发布前请确认</b>
      <ul>
        <li>信息真实，物品在手上、竞赛确实在招人。</li>
        <li>不接受预付与定金，只在校园公共区面交。</li>
        <li>不发付款码、不引到站外私聊。</li>
      </ul>
    </div>
    <label class="switch" id="pPromise" style="margin-top:14px"><i></i>我承诺以上信息真实，并遵守安全规则</label>

    <button class="btn solid" id="pGo" style="width:100%;margin-top:16px">${svg('send')}发布</button>
    <div class="tiny">发布后会立刻出现在墙上，可在「我的 · 我发布的」里下架。</div>
  `);
  let anon=false, promise=false;
  $('#pSeg').onclick=function(e){ const b=e.target.closest('button'); if(!b) return;
    S.draft.cat=b.dataset.c;
    document.querySelectorAll('#pSeg button').forEach(function(x){ x.classList.toggle('on', x.dataset.c===b.dataset.c); }); };
  $('#pAnon').onclick=function(){ anon=!anon; this.classList.toggle('on',anon); };
  $('#pPromise').onclick=function(){ promise=!promise; this.classList.toggle('on',promise); };
  $('#pGo').onclick=function(){
    const title=$('#pTitle').value.trim(), body=$('#pBody').value.trim();
    const priceRaw=$('#pPrice').value.trim(), place=$('#pPlace').value.trim();
    let bad=false;
    $('#fTitle').classList.toggle('bad', title.length<4); if(title.length<4) bad=true;
    $('#fBody').classList.toggle('bad', body.length<8); if(body.length<8) bad=true;
    const priceOk = priceRaw==='' || /^\d+(\.\d{1,2})?$/.test(priceRaw);
    $('#fPrice').classList.toggle('bad', !priceOk); if(!priceOk) bad=true;
    if(bad){ toast('还有必填项没填对'); return; }
    const joined=title+' '+body;
    const hit=riskHits(joined);
    if(hit){ toast('内容里有「'+hit+'」，平台不允许预付或站外转账，改一下再发'); return; }
    if(!promise){ toast('请先勾选“信息真实并遵守安全规则”'); return; }
    const id='n'+Date.now();
    S.posts.unshift({id:id,cat:S.draft.cat,au: anon? '匿名同学' : (S.me.name||'我'),
      title:title, body:body, price: priceRaw? parseFloat(priceRaw):0, place: place||'面议',
      ago:'刚刚', verified:S.me.verified, likes:0, img:imgFor(S.draft.cat), cm:[], by:'me'});
    saveAll(); closeSheet(); S.view='wall'; S.cat='全部'; S.q=''; renderStrip(); render();
    const el=document.querySelector('[data-pid="'+id+'"]');
    if(el){ el.classList.add('flash'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
    toast(anon? '已匿名发布 · 出现在墙上最前面' : '发布成功 · 已出现在墙上');
  };
}

/* ================= 事件接线 ================= */
document.addEventListener('click',function(e){
  const t=e.target;
  const cat=t.closest('[data-cat]');
  if(cat){ S.cat=cat.dataset.cat; renderStrip(); render(); return; }
  const like=t.closest('[data-like]');
  if(like){
    const id=like.dataset.like, i=S.me.likes.indexOf(id);
    if(i>-1) S.me.likes.splice(i,1); else S.me.likes.push(id);
    like.classList.add('pop'); saveAll(); render(); return;
  }
  const take=t.closest('[data-take]');
  if(take){ e.stopPropagation(); const id=take.dataset.take;
    const p=S.posts.find(function(x){ return x.id===id; }); if(!p) return;
    takeAndShow(p); return;
  }
  const open=t.closest('[data-pid]');
  if(open && !t.closest('button')){ openPost(open.dataset.pid); return; }
  const openB=t.closest('[data-open]');
  if(openB){ openPost(openB.dataset.open); return; }
  const del=t.closest('[data-del]');
  if(del){ S.posts=S.posts.filter(function(x){ return x.id!==del.dataset.del; }); saveAll(); render();
    toast('已下架'); return; }
  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='publish') openPublish();
    else if(a==='verify') openVerify();
    else if(a==='safety'){ S.view='safety'; render(); }
    else if(a.indexOf('cat:')===0){ S.cat=a.slice(4); renderStrip(); S.view='wall'; render(); }
    return;
  }
});
$('#bnav').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(!b) return;
  const v=b.dataset.v;
  if(v==='publish'){ openPublish(); return; }
  S.view=v; render();
});
$('#searchToggle').onclick=function(){
  const w=$('#searchWrap');
  const show=!w.classList.contains('on');
  w.classList.toggle('on', show);
  if(show) $('#q').focus();
};
$('#verifyPill').onclick=function(){ openVerify(); };
$('#q').addEventListener('input',function(e){
  S.q=e.target.value.trim();
  if(S.view!=='wall'){ S.view='wall'; }
  render();
});

/* ================= boot ================= */
paintIcons(document);
/* 吸顶两层：报头高度同步给分类条 */
function syncHH(){
  const h=document.querySelector('header');
  if(h) document.documentElement.style.setProperty('--hh', h.offsetHeight+'px');
}
window.addEventListener('resize', syncHH);
window.addEventListener('orientationchange', function(){ setTimeout(syncHH,120); });
(function(){
  const d=new Date();
  const wd=['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
  const el=document.getElementById('mastDate');
  if(el) el.textContent=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+'  '+wd;
})();
bindStrip();
renderStrip();
render();
if(!localStorage.getItem(KEY+'.seen')){
  localStorage.setItem(KEY+'.seen','1');
  }
</script>
