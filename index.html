<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCF8F3">
<title>校园π · 校园墙</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#FAF9F6;
  --paper-2:#F2F0EA;
  --ink:#111110;
  --sub:#6E6961;
  --faint:#A7A199;
  --rule:#D8D3CA;
  --signal:#B0362A;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
}
html,body{height:100%;overflow-x:hidden}
body{font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;max-width:1120px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;padding-bottom:74px;background:var(--paper)}
.ico{width:16px;height:16px;flex:0 0 auto;display:block;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:butt;stroke-linejoin:miter}

/* ---------- masthead ---------- */
header{padding:22px 24px 0}
.mast{display:flex;align-items:flex-end;gap:12px;padding-bottom:12px}
.brand{display:flex;flex-direction:column;gap:3px}
.brand b{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1}
.brand i{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.28em;color:var(--sub)}
.mast .meta{margin-left:auto;text-align:right;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
  color:var(--sub);line-height:1.7}
.h-actions{display:flex;align-items:center;gap:8px;margin-left:18px}
.pill{height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);
  background:transparent;color:var(--ink);font-size:11.5px;font-weight:500;cursor:pointer;border-radius:0;
  font-family:inherit;transition:background .12s,color .12s}
.pill:hover{background:var(--ink);color:var(--paper)}
.pill .ico{width:13px;height:13px;stroke-width:1.6}
.pill.ok{border-color:var(--signal);color:var(--signal)}
.pill.ok:hover{background:var(--signal);color:#fff}
.mast-rule{height:2px;background:var(--ink)}
.searchbar{position:relative;padding:10px 24px 0;display:none}
.searchbar.on{display:block}
.searchbar input{width:100%;height:40px;padding:0 12px 0 34px;font-size:12.5px;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:0;outline:none;font-family:inherit}
.searchbar input:focus{border-color:var(--ink)}
.searchbar .ico{position:absolute;left:32px;top:22px;color:var(--faint);width:14px;height:14px}

/* ---------- category strip ---------- */
.strip-wrap{border-bottom:1px solid var(--ink)}
.strip{display:flex;overflow-x:auto;scrollbar-width:none;cursor:grab;user-select:none}
.strip::-webkit-scrollbar{display:none}
.strip.dragging{cursor:grabbing}
.chip{flex:0 0 auto;height:38px;padding:0 15px;border:0;border-right:1px solid var(--rule);
  background:transparent;color:var(--sub);font-size:12px;letter-spacing:.02em;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;font-family:inherit;border-radius:0;transition:.12s}
.chip .ico{width:13px;height:13px;opacity:.65;stroke-width:1.5}
.chip:hover{color:var(--ink);background:var(--paper-2)}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.on .ico{opacity:1}
.hint-swipe{padding:10px 24px 0;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--faint);
  display:flex;align-items:center;gap:6px}
.hint-swipe .ico{width:11px;height:11px}

/* ---------- feature band (swipe) ---------- */
.car{margin:16px 24px 0;border:1px solid var(--ink);overflow:hidden;touch-action:pan-y;position:relative}
.car-track{display:flex;transition:transform .3s cubic-bezier(.3,0,.2,1);will-change:transform}
.slide{flex:0 0 100%;min-height:168px;padding:20px 22px 18px;display:flex;flex-direction:column;
  justify-content:space-between;background:var(--paper)}
.slide + .slide{border-left:1px solid var(--rule)}
.slide .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--signal);
  display:flex;align-items:center;gap:7px}
.slide .eyebrow::before{content:"";width:16px;height:1px;background:var(--signal)}
.slide h2{font-family:var(--serif);font-size:clamp(18px,2vw,23px);font-weight:600;letter-spacing:-.3px;
  line-height:1.45;margin-top:9px;max-width:22em}
.slide .rowline{display:flex;align-items:flex-end;gap:26px;margin-top:18px;flex-wrap:wrap}
.slide .num b{display:block;font-family:var(--mono);font-size:26px;font-weight:400;letter-spacing:-1px;
  line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.slide .num span{display:block;margin-top:4px;font-size:10px;color:var(--sub);letter-spacing:.04em;white-space:nowrap}
.slide .cta{margin-left:auto;height:32px;padding:0 14px;border:1px solid var(--ink);background:var(--ink);
  color:var(--paper);font-size:11.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;
  cursor:pointer;font-family:inherit;border-radius:0;white-space:nowrap;flex:0 0 auto;transition:.12s}
.slide .cta:hover{background:var(--paper);color:var(--ink)}
.slide .cta .ico{width:12px;height:12px}
.dots{display:flex;gap:0;border-top:1px solid var(--rule);background:var(--paper)}
.dots i{flex:1;height:3px;background:var(--rule);cursor:pointer;transition:background .2s}
.dots i.on{background:var(--ink)}

/* ---------- feed ---------- */
main{flex:1;padding:0 24px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 0;
  padding-bottom:8px;border-bottom:1px solid var(--ink)}
.sec h3{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.02em}
.sec .count{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--sub)}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1px;
  background:var(--rule);border-bottom:1px solid var(--rule)}
.post{position:relative;padding:18px 18px 14px;cursor:pointer;background:var(--paper);
  display:flex;flex-direction:column;transition:background .12s}
.post:hover{background:var(--paper-2)}
.post:first-child{animation:none}
.who{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.avatar{width:26px;height:26px;display:grid;place-items:center;font-family:var(--serif);font-size:12px;
  border:1px solid var(--rule);background:var(--paper);color:var(--sub)}
.who .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
.who .nm b{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:4px}
.who .nm b .ico{width:11px;height:11px;color:var(--signal);stroke-width:1.8}
.who .nm span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--faint)}
.who .tag{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--sub);
  border:1px solid var(--rule);padding:2px 6px}
.post h4{font-family:var(--serif);font-size:15.5px;font-weight:600;line-height:1.5;letter-spacing:-.1px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .txt{font-size:12.5px;line-height:1.8;color:var(--sub);margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb{position:relative;margin-top:12px;height:104px;border:1px solid var(--rule);overflow:hidden;
  background-image:repeating-linear-gradient(45deg,rgba(17,17,16,.045) 0 1px,transparent 1px 7px)}
.thumb .tlabel{position:absolute;left:10px;top:9px;font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;color:var(--faint)}
.thumb .tmark{position:absolute;right:10px;bottom:8px;color:var(--faint)}
.thumb .tmark .ico{width:22px;height:22px;stroke-width:1.1}
.post .foot{display:flex;align-items:center;gap:14px;margin-top:auto;padding-top:12px;
  border-top:1px solid var(--rule)}
.act{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;color:var(--sub);
  background:none;border:0;padding:0;cursor:pointer;letter-spacing:.02em;transition:color .12s}
.act .ico{width:13px;height:13px;stroke-width:1.5}
.act:hover{color:var(--ink)}
.act.on{color:var(--signal)}
.act.on .ico{fill:rgba(176,54,42,.12)}
.price{margin-left:auto;font-family:var(--mono);font-size:14px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.price.free{font-size:10px;letter-spacing:.12em;color:var(--sub)}
.take{height:28px;padding:0 10px;border:1px solid var(--ink);background:transparent;color:var(--ink);
  font-size:11px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
  font-family:inherit;border-radius:0;transition:.12s}
.take:hover{background:var(--ink);color:var(--paper)}
.take .ico{width:12px;height:12px}

/* ---------- bottom nav ---------- */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:56px;display:flex;align-items:stretch;
  max-width:1120px;margin:0 auto;background:var(--paper);border-top:1px solid var(--ink)}
.bnav button{flex:1;border:0;border-right:1px solid var(--rule);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--sub);border-radius:0;transition:.12s}
.bnav button:last-child{border-right:0}
.bnav button .ico{width:15px;height:15px}
.bnav button.on{background:var(--ink);color:var(--paper)}
.bnav button:hover{color:var(--ink)}
.bnav button.on:hover{color:var(--paper)}
.bnav .fab-btn{border-right:1px solid var(--rule);flex:0 0 92px;padding:0}
.bnav .fab{width:34px;height:34px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.bnav .fab-btn.on .fab{background:var(--paper);color:var(--ink)}
.fab .ico{width:17px;height:17px;stroke-width:2}

/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;z-index:40;background:rgba(17,17,16,.32);opacity:0;pointer-events:none;transition:opacity .18s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;width:min(620px,100%);margin:0 auto;
  max-height:92dvh;overflow-y:auto;padding:0 24px 24px;background:var(--paper);
  border-top:2px solid var(--ink);transform:translateY(101%);
  transition:transform .26s cubic-bezier(.3,0,.2,1)}
.sheet.on{transform:none}
.grab{display:none}
.sheet h3{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.3px;line-height:1.45;
  margin:18px 0 6px}
.sheet .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--sub);margin-top:4px}
.sheet .body{font-size:13px;line-height:1.9;color:#3F3B36;margin:14px 0}
.sheet .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.24em;color:var(--sub);
  margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.btn{height:44px;border:1px solid var(--ink);border-radius:0;font-size:12.5px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:inherit;transition:.12s}
.btn .ico{width:14px;height:14px}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--paper);color:var(--ink)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.line{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.line:hover{border-color:var(--ink);background:var(--paper-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.field{margin-bottom:12px}
.field>span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--sub);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;font-size:12.5px;border:1px solid var(--rule);
  border-radius:0;background:var(--paper);color:var(--ink);outline:none;font-family:inherit;transition:border-color .12s}
.field textarea{min-height:84px;resize:vertical;line-height:1.8}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.field .err{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--signal);margin-top:5px;display:none}
.field.bad input,.field.bad textarea{border-color:var(--signal)}
.field.bad .err{display:block}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule)}
.seg button{height:34px;padding:0 13px;border:0;border-right:1px solid var(--rule);border-radius:0;
  background:transparent;color:var(--sub);font-size:11.5px;cursor:pointer;font-family:inherit;transition:.12s}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--paper-2);color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
.switch{display:flex;align-items:center;gap:9px;font-size:12px;color:#3F3B36;cursor:pointer;margin-top:12px;
  user-select:none}
.switch i{width:14px;height:14px;border:1px solid var(--ink);position:relative;flex:0 0 auto;background:var(--paper)}
.switch.on i{background:var(--ink)}
.switch.on i::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;
  border-right:1.5px solid var(--paper);border-bottom:1.5px solid var(--paper);transform:rotate(40deg)}
.safe{margin-top:16px;padding:12px 14px;border:1px solid var(--rule);border-left:2px solid var(--signal);
  background:var(--paper)}
.safe b{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;
  color:var(--signal);margin-bottom:8px}
.safe b .ico{width:12px;height:12px;stroke-width:1.8}
.safe ul{padding-left:14px;font-size:11.5px;line-height:1.9;color:#4A4540}
.spec{display:grid;grid-template-columns:1fr 1fr;margin:16px 0;border:1px solid var(--rule)}
.spec div{padding:10px 12px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.spec div:nth-child(2n){border-right:0}
.spec div:nth-last-child(-n+2){border-bottom:0}
.spec span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--faint);margin-bottom:4px}
.spec b{font-size:12px;font-weight:600;font-family:var(--mono)}
.cmts{margin-top:4px;display:flex;flex-direction:column}
.cm{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule)}
.cm .avatar{width:22px;height:22px;font-size:10px}
.cm div{font-size:12px;line-height:1.75;color:#46413C}
.cm div b{font-size:10.5px;color:var(--ink);display:block;font-family:var(--mono);letter-spacing:.06em;font-weight:500}
.cm-in{display:flex;gap:0;margin-top:14px;border:1px solid var(--rule)}
.cm-in input{flex:1;height:42px;padding:0 12px;border:0;background:var(--paper);color:var(--ink);
  font-size:12.5px;outline:none;font-family:inherit}
.cm-in button{width:44px;height:42px;border:0;border-left:1px solid var(--ink);background:var(--ink);
  color:var(--paper);display:grid;place-items:center;cursor:pointer;border-radius:0}
.cm-in button .ico{width:14px;height:14px}
.empty{padding:56px 0;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:var(--faint);line-height:2.2}
.empty .ico{width:22px;height:22px;margin:0 auto 12px;stroke-width:1;color:var(--faint)}

/* ---------- mine / safety ---------- */
.card-lg{padding:20px;border:1px solid var(--ink);background:var(--paper)}
.idcard{display:flex;align-items:center;gap:14px}
.idcard .avatar{width:46px;height:46px;font-size:17px}
.idcard .me{flex:1;min-width:0}
.idcard h4{font-family:var(--serif);font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
.idcard h4 .ico{width:14px;height:14px;color:var(--signal);stroke-width:1.8}
.idcard p{font-size:11px;color:var(--sub);margin-top:5px;line-height:1.7}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 0;border-top:1px solid var(--rule)}
.stats3 div{padding:14px 0;border-right:1px solid var(--rule);text-align:left}
.stats3 div:last-child{border-right:0}
.stats3 b{display:block;font-family:var(--mono);font-size:21px;font-weight:400;letter-spacing:-.8px;
  font-variant-numeric:tabular-nums}
.stats3 span{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;color:var(--faint)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row-item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--rule);
  cursor:default}
.row-item[data-act]{cursor:pointer}
.row-item[data-act]:hover{background:var(--paper-2)}
.row-item .t{flex:1;min-width:0}
.row-item b{font-size:12.5px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item span{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--sub)}
.row-item .code{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:3px 7px;
  border:1px solid var(--signal);color:var(--signal)}
.mini{height:26px;padding:0 9px;border:1px solid var(--rule);background:transparent;font-size:10.5px;
  color:var(--ink);cursor:pointer;font-family:inherit;border-radius:0;transition:.12s}
.mini:hover{border-color:var(--ink);background:var(--paper-2)}
.shead{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.4px;line-height:1.45;
  margin:22px 0 8px}
.slead{font-size:12.5px;color:var(--sub);line-height:1.9;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.slist{display:flex;flex-direction:column}
.scard{padding:16px 2px;border-bottom:1px solid var(--rule)}
.scard h5{font-family:var(--serif);font-size:14px;font-weight:600;display:flex;align-items:baseline;gap:10px;
  margin-bottom:7px}
.scard h5 .n{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--signal);flex:0 0 auto}
.scard h5 .ico{width:13px;height:13px;color:var(--signal);position:relative;top:2px}
.scard p{font-size:12px;line-height:1.9;color:#4A4540}
.scard .btn{margin-top:12px;width:100%}
.tiny{font-family:var(--mono);font-size:9.5px;line-height:1.9;color:var(--faint);letter-spacing:.04em;
  margin-top:16px;padding-top:10px;border-top:1px solid var(--rule)}

.sheet-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
  height:42px;margin:0 -24px;padding:0 24px;background:var(--paper);border-bottom:1px solid var(--rule)}
.sheet-bar .mono-lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;color:var(--faint)}
.sheet-close{width:26px;height:26px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;border-radius:0;padding:0}
.sheet-close:hover{border-color:var(--ink);background:var(--paper-2)}
.sheet-close .ico{width:12px;height:12px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:72px;z-index:99;transform:translate(-50%,10px);
  padding:10px 16px;font-size:11.5px;line-height:1.6;color:var(--paper);background:var(--ink);
  border-radius:0;opacity:0;pointer-events:none;transition:.16s;max-width:84%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
  header{padding:14px 14px 0}
  .mast{gap:8px;padding-bottom:10px;flex-wrap:nowrap}
  .brand b{font-size:21px}
  .brand i{font-size:7.5px;letter-spacing:.2em}
  .mast .meta{display:none}
  .h-actions{margin-left:auto;gap:5px}
  .pill{padding:0 7px;font-size:10px;height:28px;white-space:nowrap;gap:5px}
  .pill span{white-space:nowrap}
  .pill .ico{width:11px;height:11px}
  .searchbar{padding:10px 16px 0}
  .searchbar .ico{left:24px}
  .strip{padding:0}
  .chip{height:36px;padding:0 13px;font-size:11.5px}
  .hint-swipe{padding:6px 16px 0}
  .car{margin:12px 14px 0}
  .slide{padding:14px 14px 12px;min-height:0}
  .slide .eyebrow{font-size:8px}
  .slide h2{font-size:17px;margin-top:7px;line-height:1.4}
  .slide .rowline{margin-top:13px;gap:14px;flex-wrap:nowrap;align-items:center}
  .slide .num b{font-size:20px}
  .slide .num span{font-size:9px;margin-top:3px}
  .slide .cta{height:28px;padding:0 10px;font-size:10.5px;margin-left:auto}
  main{padding:0 16px}
  .feed{grid-template-columns:1fr;background:transparent;gap:0}

function load(k,d){ try{ const v=localStorage.getItem(KEY+'.'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }

const $=function(s){ return document.querySelector(s); };
const esc=function(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
function toast(m){ const t=$('#toast'); t.innerHTML=m; t.classList.add('on'); clearTimeout(t._h);
  t._h=setTimeout(function(){ t.classList.remove('on'); },2200); }
function initials(n){ return (n||'匿').replace(/^匿名.*$/,'匿').slice(0,1); }
const RISK=['预付','定金','转账','二维码','扫码付','加微信','加V','加v','先付款','押金','付款后发货','链接支付','红包','付款码'];
/* 带否定语境的命中不算风险：「不用预付」「不接受转账」「别发红包」 */
function riskHits(text){
  for(let k=0;k<RISK.length;k++){
    const w=RISK[k]; let i=text.indexOf(w);
    while(i>-1){
      const before=text.slice(Math.max(0,i-3),i);
      if(!/[不别勿拒没无免]/.test(before)) return w;
      i=text.indexOf(w,i+1);
    }
  }
  return null;
}

/* ================= 视图：校园墙 ================= */
function slideHTML(){

function renderWall(){
  const slides=slideHTML();
  const list=filtered();
  return `
  <section class="car" id="car">
    <div class="car-track" id="carTrack">
      ${slides.map(s=>`<div class="slide ${s.cls}">

          <h2>${s.h}</h2>
        </div>
        <div class="rowline">
          ${s.nums.map(n=>`<div class="num"><b>${n[0]}</b><span>${n[1]}</span></div>`).join('')}

        </div>
      </div>`).join('')}
    </div>
    <div class="dots" id="dots">${slides.map((_,i)=>`<i class="${i===0?'on':''}" data-dot="${i}"></i>`).join('')}</div>
  </section>

  <div class="sec"><h3>${S.cat==='全部'?'校园墙':S.cat}</h3><span class="count">${list.length} 条 · 可接单</span></div>

    : `<div class="empty">${svg('search')}<div>这一类还没有人发，<br>你可以做第一个</div></div>`}`;
}

function filtered(){
  return S.posts.filter(function(p){
    const okCat = S.cat==='全部' || p.cat===S.cat;
    const q=S.q.toLowerCase();
    const okQ = !q || (p.title+p.body+p.au+p.cat).toLowerCase().indexOf(q)>-1;
    return okCat && okQ;
  });
}

function postCard(p){
  const liked=S.me.likes.indexOf(p.id)>-1;
  const cIcon = (CATS.find(function(c){ return c.k===p.cat; })||{i:'grid'}).i;
  const art = (p.art===null||p.art===undefined) ? ''
    : `<div class="thumb">
         <span class="tlabel">${p.cat} · 无图</span><span class="tmark">${svg(cIcon)}</span>
       </div>`;
  return `<article class="post" data-pid="${p.id}">
    <div class="who">
      <div class="avatar">${initials(p.au)}</div>
      <div class="nm">
        <b>${esc(p.au)} ${p.verified?svg('shield'):''}</b>
        <span>${p.verified?'在校生 · 已认证':'未认证'} · ${p.ago}</span>
      </div>
      <div class="tag">${p.cat}</div>
    </div>
    <h4>${esc(p.title)}</h4>
    <div class="txt">${esc(p.body)}</div>
    ${art}
    <div class="foot">
      <button class="act ${liked?'on':''}" data-like="${p.id}">${svg('heart')}${p.likes + (liked?1:0)}</button>
      <button class="act" data-open="${p.id}">${svg('chat')}${p.cm.length}</button>
      ${p.price? `<span class="price">¥${p.price}</span>` : `<span class="price free">免费 · 互助</span>`}
      <button class="take" data-take="${p.id}">${svg('spark')}接单</button>
    </div>
  </article>`;
}

/* ================= 视图：防骗 ================= */
function renderSafety(){
  const rules=[

    ['只在校内公共区见','食堂、图书馆门前、宿舍楼下值班室。不去校外出租屋、不去偏僻车库。'],

    ['验货再确认','书翻到版权页，电器当面通电，衣服看吊牌。确认没问题再让对方走。'],
    ['留痕不留把柄','对话留在站内，别加私人号。真出事，记录就是证据。']

  return `
  <h2 class="shead">先保护自己，<br>再谈这笔交易</h2>
  <p class="slead">校园里绝大多数纠纷不是因为坏人，而是因为“太熟了不好意思验”。下面五条，是这里所有交易的默认规则。</p>
  <div class="slist">
    ${rules.map(function(r,i){ return `<div class="scard">
      <h5><span class="n">${i+1}</span>${r[0]}</h5><p>${r[1]}</p></div>`; }).join('')}
  </div>

  <div class="scard" style="margin-top:14px">
    <h5><span class="n">${svg('shield')}</span>在校生认证怎么做的</h5>
    <p>学号 + 姓名 + 校园卡后四位，两步入库比对。认证只为了让对方知道“这是本校在读的人”，不显示学号，也不对外提供。未认证的账号可以浏览、可以留言，但不能接单，发布内容会标“未认证”。</p>
    <button class="btn line" style="margin-top:12px;width:100%" data-act="verify">${S.me.verified?'已认证 · 查看':'现在认证'} ${svg('chev')}</button>
  </div>

  <div class="sec" style="margin-top:22px"><h3>举报记录</h3><span class="count">${S.reports.length} 条</span></div>
  <div class="list">

/* ================= 轮播（可拖动） ================= */
function bindCarousel(){
  const car=$('#car'), track=$('#carTrack'); if(!car) return;
  const n=track.children.length;
  let x0=0, dx=0, down=false, w=car.clientWidth;
  function go(i,animate){
    S.slide=(i+n)%n;
    track.style.transition=animate===false?'none':'transform .52s cubic-bezier(.22,1,.36,1)';
    track.style.transform='translateX('+(-S.slide*w)+'px)';
    document.querySelectorAll('#dots i').forEach(function(d,k){ d.classList.toggle('on',k===S.slide); });
  }
  go(S.slide,false);
  car.addEventListener('pointerdown',function(e){
    if(e.target.closest('[data-act]')) return;
    down=true; x0=e.clientX; dx=0; w=car.clientWidth; track.style.transition='none';
    try{ car.setPointerCapture(e.pointerId); }catch(err){}
  });
  car.addEventListener('pointermove',function(e){
    if(!down) return;
    dx=e.clientX-x0;
    track.style.transform='translateX('+(-S.slide*w+dx)+'px)';
  });
  function up(){
    if(!down) return;
    down=false;
    if(Math.abs(dx)>w*0.18) go(S.slide+(dx<0?1:-1)); else go(S.slide);
  }
  car.addEventListener('pointerup',up);
  car.addEventListener('pointercancel',up);
  document.querySelectorAll('[data-dot]').forEach(function(d){
    d.onclick=function(){ go(parseInt(d.dataset.dot,10)); };
  });
  clearInterval(window._carTimer);
  window._carTimer=setInterval(function(){ if(S.view==='wall') go(S.slide+1); }, 5200);
}

/* ================= 分类条：拖动 + 惯性 ================= */
function bindStrip(){
  const el=$('#strip');
  let down=false, x0=0, sl=0, moved=0, v=0, last=0, raf=null;
  el.addEventListener('pointerdown',function(e){
    down=true; x0=e.clientX; sl=el.scrollLeft; moved=0; v=0; last=e.clientX;
    el.classList.add('dragging'); cancelAnimationFrame(raf);
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener('pointermove',function(e){
    if(!down) return;
    const dx=e.clientX-x0; moved=Math.max(moved,Math.abs(dx));
    el.scrollLeft=sl-dx;
    v=e.clientX-last; last=e.clientX;
  });
  function release(){
    if(!down) return; down=false; el.classList.remove('dragging');
    (function inertia(){
      v*=0.92; if(Math.abs(v)<0.6) return;
      el.scrollLeft-=v; raf=requestAnimationFrame(inertia);
    })();
  }
  el.addEventListener('pointerup',release);
  el.addEventListener('pointercancel',release);
  el.addEventListener('click',function(e){
    if(moved>7){ e.preventDefault(); e.stopPropagation(); }
  },true);
}

function openVerify(hint){
  openSheet(`
    <div class="grab"></div>

    </div>
    <div style="margin-top:16px">
      <div class="field" id="fName"><span>真实姓名</span><input id="vName" placeholder="与校园卡一致" value="${esc(S.me.school||'')}"><div class="err">请填写真实姓名</div></div>

      <div class="field" id="fCard"><span>校园卡后四位</span><input id="vCard" placeholder="4 位数字" inputmode="numeric" maxlength="4"><div class="err">请填 4 位数字</div></div>
    </div>
    <button class="btn solid" id="vGo" style="width:100%">${S.me.verified?'重新核验':'提交认证'}</button>
    <div class="tiny">演示版：校验只在本机进行，填任意合规格式即可通过。真实版本走学校统一身份或云函数校验。</div>
  `);

    const n=$('#vName').value.trim(), sid=$('#vSid').value.trim(), card=$('#vCard').value.trim();
    let bad=false;
    $('#fName').classList.toggle('bad', n.length<2); if(n.length<2) bad=true;

    $('#fCard').classList.toggle('bad', !/^\d{4}$/.test(card)); if(!/^\d{4}$/.test(card)) bad=true;

function openPublish(){
  const cats=['二手书','竞赛','课程','闲置','搭子','求助'];
  openSheet(`
    <div class="grab"></div>
    <h3>发一条到校园墙</h3>
    <p class="sub">${S.me.verified?'已认证 · 会带认证标识':'未认证也能发，但会标未认证、且不能接单'}</p>

    <div class="lbl">类型</div>
    <div class="seg" id="pSeg">${cats.map(function(c){
      return `<button data-c="${c}" class="${S.draft.cat===c?'on':''}">${c}</button>`; }).join('')}</div>

    <div class="lbl">标题</div>
    <div class="field" id="fTitle"><input id="pTitle" maxlength="40" placeholder="一句话说清是什么，比如“高数同济第七版 30 块带走”"><div class="err">标题至少 4 个字</div></div>

    <div class="lbl">详细一点</div>

    <div class="lbl">价格与地点</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field" id="fPrice"><input id="pPrice" inputmode="decimal" placeholder="价格，免费留空"><div class="err">价格应为数字</div></div>
      <div class="field" id="fPlace"><input id="pPlace" maxlength="16" placeholder="地点，如本部三食堂"><div class="err"></div></div>
    </div>

    <label class="switch" id="pAnon"><i></i>匿名发布（不显示昵称，仍显示是否认证）</label>

    <div class="safe" style="margin-top:16px">
      <b>${svg('shield')}发布前请确认</b>
      <ul>
        <li>信息真实，物品在手上、竞赛确实在招人。</li>
        <li>不接受预付与定金，只在校园公共区面交。</li>
        <li>不发付款码、不引到站外私聊。</li>
      </ul>
    </div>
    <label class="switch" id="pPromise" style="margin-top:14px"><i></i>我承诺以上信息真实，并遵守安全规则</label>

    <button class="btn solid" id="pGo" style="width:100%;margin-top:16px">${svg('send')}发布</button>
    <div class="tiny">发布后会立刻出现在墙上，可在「我的 · 我发布的」里下架。</div>
  `);
  let anon=false, promise=false;
  $('#pSeg').onclick=function(e){ const b=e.target.closest('button'); if(!b) return;
    S.draft.cat=b.dataset.c;
    document.querySelectorAll('#pSeg button').forEach(function(x){ x.classList.toggle('on', x.dataset.c===b.dataset.c); }); };
  $('#pAnon').onclick=function(){ anon=!anon; this.classList.toggle('on',anon); };
  $('#pPromise').onclick=function(){ promise=!promise; this.classList.toggle('on',promise); };
  $('#pGo').onclick=function(){
    const title=$('#pTitle').value.trim(), body=$('#pBody').value.trim();
    const priceRaw=$('#pPrice').value.trim(), place=$('#pPlace').value.trim();
    let bad=false;
    $('#fTitle').classList.toggle('bad', title.length<4); if(title.length<4) bad=true;
    $('#fBody').classList.toggle('bad', body.length<8); if(body.length<8) bad=true;
    const priceOk = priceRaw==='' || /^\d+(\.\d{1,2})?$/.test(priceRaw);
    $('#fPrice').classList.toggle('bad', !priceOk); if(!priceOk) bad=true;
    if(bad){ toast('还有必填项没填对'); return; }
    const joined=title+' '+body;
    const hit=riskHits(joined);
    if(hit){ toast('内容里有「'+hit+'」，平台不允许预付或站外转账，改一下再发'); return; }
    if(!promise){ toast('请先勾选“信息真实并遵守安全规则”'); return; }
    const id='n'+Date.now();
    S.posts.unshift({id:id,cat:S.draft.cat,au: anon? '匿名同学' : (S.me.name||'我'),
      title:title, body:body, price: priceRaw? parseFloat(priceRaw):0, place: place||'面议',
      ago:'刚刚', verified:S.me.verified, likes:0, art:null, cm:[], by:'me'});
    saveAll(); closeSheet(); S.view='wall'; S.cat='全部'; S.q=''; renderStrip(); render();
    const el=document.querySelector('[data-pid="'+id+'"]');

    toast(anon? '已匿名发布 · 出现在墙上最前面' : '发布成功 · 已出现在墙上');
  };
}

/* ================= 事件接线 ================= */
document.addEventListener('click',function(e){
  const t=e.target;
  const cat=t.closest('[data-cat]');
  if(cat){ S.cat=cat.dataset.cat; renderStrip(); render(); return; }
  const like=t.closest('[data-like]');
  if(like){
    const id=like.dataset.like, i=S.me.likes.indexOf(id);
    if(i>-1) S.me.likes.splice(i,1); else S.me.likes.push(id);
    like.classList.add('pop'); saveAll(); render(); return;
  }
  const take=t.closest('[data-take]');
  if(take){ e.stopPropagation(); const id=take.dataset.take;
    const p=S.posts.find(function(x){ return x.id===id; }); if(!p) return;
    takeAndShow(p); return;
  }
  const open=t.closest('[data-pid]');
  if(open && !t.closest('button')){ openPost(open.dataset.pid); return; }
  const openB=t.closest('[data-open]');
  if(openB){ openPost(openB.dataset.open); return; }
  const del=t.closest('[data-del]');
  if(del){ S.posts=S.posts.filter(function(x){ return x.id!==del.dataset.del; }); saveAll(); render();
    toast('已下架'); return; }
  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='publish') openPublish();
    else if(a==='verify') openVerify();
    else if(a==='safety'){ S.view='safety'; render(); }
    else if(a.indexOf('cat:')===0){ S.cat=a.slice(4); renderStrip(); S.view='wall'; render(); }
    return;
  }
});
$('#bnav').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(!b) return;
  const v=b.dataset.v;
  if(v==='publish'){ openPublish(); return; }
  S.view=v; render();
});
$('#searchToggle').onclick=function(){
  const w=$('#searchWrap');
  const show=!w.classList.contains('on');
  w.classList.toggle('on', show);

$('#verifyPill').onclick=function(){ openVerify(); };
$('#q').addEventListener('input',function(e){
  S.q=e.target.value.trim();

});
